# Machine-readable routing policy. Consumed by bin/route_agent.py and
# bin/acp-dispatch. Edit here; do not restate the data in Python.
# Profiles from docs/model-routing.md "Which AI for which work", rewritten
# 2026-10-15 to the operator's routing policy and narrowed 2026-10-18: Claude
# Fable 5.1 and codex's top frontier model (gpt-6-astra today) are reached
# only through the `frontier` kind, one slice per pool per wave (two on claude under the standing
# allowance of 2026-10-27 while the Claude reading passes, docs/gates.md); judgment is
# Opus 5.5 at high first, and codex gpt-6.1-sol at high as a lower-ranked,
# eligible pool while its quota is plentiful (operator 2026-10-25); everyday work goes to the
# OTHER pools, plus codex's everyday
# models (never astra) while its quota is plentiful (`plenty_min`, operator 2026-10-25);
# the copilot reserve row was removed 2026-11-06 (slim-down E9: the copilot CLI retired; Paseo's
# Copilot provider replaces it); the grok CLI's SuperGrok pool retired 2026-11-07 (subscription
# cancelled in favour of Cursor; grok-bot is Cursor-billed and never a slice target);
# 2026-11-08: Hermes is never a target. Legacy omp/OpenCode transports are archived;
# Pi uses separately accepted Z.ai and retained Cursor profiles. API credit billing
# blocks are not subscription exhaustion, and never authorize an archived fallback.
# Current automatic pools: Claude, Codex, Cursor (vendor Auto, Pi Composer and cloud),
# Z.ai through Pi, and the gated native Antigravity Argon frontier fallback.
# Other named rows preserve historical policy or reserved substrate metadata.
# `models` is the acp-dispatch `--model [--effort L]` suggestion per kind, ids as
# `paseo provider models <agent> --json` lists them (`route_agent.py services --check-models`);
# `agent` is the Paseo provider when it differs from the pool name.

# Google AI Pro and the separately billed Gemini API are distinct. The native
# antigravity-argon row is a gated fallback; the Pi community OAuth integration
# must establish its own account entitlement and fresh shared-pool quota.

[routing]
# Kinds of work. Deliberately few — a taxonomy nobody can apply is worse than
# a coarse one that gets used.
# `api-only` (operator 2026-10-19): work that needs the Claude API and cannot run through a
# TUI or ACP (SDK paths such as a Claude API call (a model chain is `paseo run`'s job), a verdict classifier,
# a batch or API-only job). omp's Claude API credits are
# eligible (pi's OpenAI API pool was retired 2026-11-06); select the provider appropriate for the SDK. The caller makes the API
# call itself and `route_agent.py route --kind api-only` reports capacity.
# `github` and `realtime-web` have no pool since copilot (2026-11-06) and the grok CLI (2026-11-07) retired: a route for
# them finds nothing; they stay kinds so a lead's plan names them rather than failing on an unknown kind.
kinds = ["judgment", "frontier", "code", "bulk", "research", "mechanical", "github", "realtime-web", "api-only"]
# burn_first services (use-it-or-lose-it pools) win a tie-sized margin while
# they hold at least this much headroom. Static `burn_first = true` on a
# [[service]] is only a fallback when expected waste at reset is unknown
# (operator /steps 1.6, 2026-10-18: prefer computed burn_first).
burn_first_min = 40.0
burn_first_bonus = 4.0
# Expected unused share of the binding window at reset (percent points). At or
# above this, the pool gets burn_first_bonus even with burn_first = false
# (2026-10-18: codex weekly at 82% left while burning 3.2×; the retired agy Claude/GPT
# weekly hit its cap minutes after a "41% left" reading).
burn_first_waste_min = 30.0
# When the binding window's pace_ratio is above this, add pace_penalty to the
# rank (judgment/frontier take pace_penalty_judgment_factor — capability still
# dominates). 2026-10-18.
pace_penalty_above = 1.5
pace_penalty = 6.0
# Half-penalty factor for judgment/frontier pace (2026-10-18 review finding 5b).
pace_penalty_judgment_factor = 0.5
# Quality band (2026-10-18, plektra lead with djbclark's approval): a code or judgment slice
# never goes to a pool more than this many good_at rank steps worse than the best pool eligible
# for the kind, quota aside (reserves and excluded pools don't set the best). Headroom,
# burn-first and pace reorder pools inside the band; they never pull a much weaker tier in.
# Case: with the r11-r20 code pools at their headroom floors, code went to Gemini Flash (r40).
# Nothing in the band has room: no route (keep it queued until a reset, or exclude by hand).
quality_max_rank_gap = { code = 10, judgment = 10 }
# Most `frontier` slices one wave puts on a single pool, and the Fable sublimit below which frontier on claude falls
# back to Opus, are `frontier1_per_wave`/`frontier2_per_wave` and `frontier1_min_left` in config/gates.toml [frontier]
# (docs/gates.md).
# Pools with `plenty_kinds` (codex's everyday kinds, operator 2026-10-25: "if we have lots of codex
# quota and it is the best of available options we can use it for non-frontier") are eligible for
# those kinds only while the binding headroom (the tightest window of the pool, 5-hour and weekly
# alike) is at least this many percent; below it, or with no fresh reading, codex is frontier-only
# again, so a wave cannot empty the 5-hour window the way four astra slices did on 2026-10-18.
plenty_min = 50.0
# Curated profiles overlay discovery (`paseo provider ls --json` plus the quota snapshot's pools); anything
# discovered without one gets default_profile so a newly-added provider is routable rather than invisible.
default_profile = { bulk = 60, mechanical = 60 }
# Never a routable service, whatever aiuse or Paseo lists (the [discovery] table until 2026-11-07, slim-down E7):
# hermes is the operator's own assistant (operator 2026-10-15). clinepass: reserved as the lifeline/substrate of BOTH
# Hermes and Dann (operator 2026-10-23), never a slice target. Retired TUIs whose accounts aiuse still reports or
# whose providers Paseo still lists (slim-down E9, 2026-11-06; grok 2026-11-07): no curated row drives them, so
# discovery must not surface them as unprofiled, dispatchable services (`antigravity` here is the provider's other
# pools, Flash and Claude/GPT; its Argon window is the curated `antigravity-argon` row). grok-bot is the Cursor-billed Chief of
# Staff's pool, never a slice target. Names the dispatch gate holds for approval ([dispatch].operator_gated) are
# never discovered either.
never_route = ["hermes", "clinepass", "antigravity", "alibaba", "devin", "copilot", "pi", "crush", "kiro",
               "cline", "agy", "qwen", "goose", "zcode", "muse", "aider", "venicecode", "grok", "grok-bot"]
# Discovery names the provider or TUI; aiuse names the account behind it. An alias folds a provider or fork name onto
# the curated service that already covers it, so it never becomes a second entry (Paseo's `opencode` provider is the
# Go pool). The retired TUIs have no alias: they are `never_route` above.
aliases = { claude-agent-teams = "claude", openclaude = "claude", opencode = "opencode-go", kimi = "opencode-go" }

# Calibrate report thresholds (route_agent.py calibrate; monthly AI re-rank).
# Operator /steps 1.5, 2026-10-18: outcome field + AI re-ranking, not human.
[calibrate]
# Minimum finished dispatches in a service×kind before suggesting a rank change.
min_outcomes = 5
# Other services eligible for that kind required before a peer-median suggestion
# (2026-10-18 review finding 3b: a single peer auto-awards ±delta).
min_peers = 2
# Done-rate points below the peer-median for that kind → suggest +5 rank (worse).
suggest_worse_below = 25.0
suggest_worse_delta = 5
# Done-rate points above the peer-median → suggest −3 rank (better).
suggest_better_above = 15.0
suggest_better_delta = 3

[dispatch]
# Never dispatched without the operator's specific, explicit approval for that run (operator 2026-10-15).
# hermes (operator 2026-10-15: "hermes should never be used" as a delegation target) needs
# ACP_OPERATOR_APPROVED=<agent>. omp left this list on 2026-10-19 (its Claude API credits are a
# normal tier). route_agent never discovers a name listed here.
operator_gated = ["hermes"]
# Fable at xhigh/max should almost never run (operator 2026-10-18): the same approval gate, keyed
# ACP_OPERATOR_APPROVED=fable-xhigh. Fable at high is the frontier route_agent.py suggests.
fable_gated_efforts = ["xhigh", "max"]
# Substring match on --model (case-insensitive): these only run with --kind frontier
# (operator 2026-10-18; route-override does not skip this). gemini-4-argon (operator 2026-10-31): FALLBACK ONLY behind
# gpt-6-astra and Fable, through Paseo's antigravity provider (the `antigravity-argon` service).
frontier_models = ["gpt-6-astra", "fable", "gemini-4-argon"]
# Optional hard cap per service (or agent name via ACP_DISPATCH_INFLIGHT). Empty on
# purpose: the in-flight quota reservation replaced `codex = 1` (operator 2026-10-18).
# ACP_DISPATCH_INFLIGHT=name=N still overrides per run (service or agent name).
inflight_cap = {}
# Flags a dispatch line needs for the agent to accept the model at all (none since crush retired, 2026-11-06).
extra = {}

# When there is no measured history, floor the brief-size default (operator 2026-10-18:
# gpt-6-astra median 65% of codex's 5-hour window across 4 measured slices).
# 2026-10-19: the codex plan changed (Plus to the $100 plan, aiuse "prolite"); this
# floor awaits re-calibration from `route_agent.py calibrate`. Value unchanged.
# A key `SERVICE:frontier` floors only a slice on a [dispatch].frontier_models model;
# `SERVICE:KIND` floors that kind and wins over plain `SERVICE`, which floors every other
# slice (2026-10-25: codex's everyday models, luna and 6.1-sol, are not astra; 10.0 is a guess
# until `calibrate` has measured slices). History is matched on kind and effort too, so a
# floor holds until three comparable slices are measured, never on another kind's or effort's.
# `codex:judgment` = 25.0 (2026-10-25): the first judgment slices on gpt-6.1-sol at high have no
# measurement, and codex's plain 10.0 is a guess for medium `code` that would reserve too little
# for a review at high. 25.0 is a guess as well, chosen on the high side; `calibrate` replaces it.
[dispatch.estimate_floor]
"codex:frontier" = 60.0
"codex:judgment" = 25.0
codex = 10.0
claude = 8.0

# Repo-scoped override of the floors above (operator djbclark, 2026-11-01: "For tendcf/nix2cf only, allow astra down to a
# lower floor"): in these repositories astra counts as usable down to 20% of Codex quota left, so a fallback stands in only below that. The repository is the last path part of the `origin` remote of acp-dispatch's -C directory
# (a worktree such as ~/src/tendcf-foo-wt has its repository's remote; with no remote, the directory's name), or `route_agent.py plan --repo NAME` / the cwd.
# The override REPLACES the `SERVICE:frontier` floor and is also its CAP: a measured median (3+ comparable slices) still
# wins over the default floor everywhere, but here the estimate never exceeds 20 (a median of 70 is read as 20, a median
# of 2 stays 2), for the scalar estimate, each window's estimate, the in-flight reservation and the fallback predicate.
# Every other repository keeps the floors above. Accepted risk (adversary 2026-11-01 F4): the key is the NAME only, so any
# checkout named tendcf or nix2cf gets it; the effect is quota policy on this machine, nothing more.
[dispatch.repo_overrides.tendcf.estimate_floor]
"codex:frontier" = 20.0

[dispatch.repo_overrides.nix2cf.estimate_floor]
"codex:frontier" = 20.0

# The orchestrating (lead) session's own model (operator 2026-10-23; incident and rule in
# skills/model-routing/SKILL.md "Lead / orchestrator sessions"). Everything above routes
# dispatched slices; this is the session that dispatches them. `model` at `effort` by default,
# `pipeline_model` at `pipeline_effort` when the session only drives a pipeline (PR loops, waiters,
# merges; djbclark 2026-10-23: Sonnet 5.5 at medium, high only for judgment turns; effort changes on
# 5.5 keep the prompt cache). `pipeline_effort` is optional (default high). Printed by `route_agent.py policy`.
# `fable_lead` (operator 2026-11-07: "Fable leads are allowed for now, with an easy way to turn them off later"): true
# lets a lead session run on Fable 5.1 (no relaunch-on-Opus note from claude/hooks/context_size_nudge.py). Set it to
# false, or delete the line, to restore the 2026-10-23 rule: never a Fable lead (Fable only through the `fable-deep`
# sub-agent or a `frontier` slice).

[lead]
model = "opus"
effort = "high"
pipeline_model = "sonnet"
pipeline_effort = "medium"
fable_lead = true

[substrate]
# Pools `route_agent.py substrate` may name although aiuse's [disabled_services] switches them
# off (aiuse does not collect a disabled pool, so it reads as unmeasured). clinepass only: the
# lifeline/substrate of Hermes and Dann (operator 2026-10-23). Any other disabled pool is
# never chosen; with nothing left the command prints `no usable substrate` and exits 6.
lifeline = ["clinepass"]

[hermes]
# Hermes names the provider differently from aiuse for the paid pool.
provider_name = { clinepass = "cline" }
# Concrete models per Hermes-usable provider, cheapest-capable first within
# each. Only providers with access == "api" may appear: everything else is
# reachable solely through its own vendor CLI.

[hermes.models]
opencode-zen-free = ["deepseek-v4-flash-free", "hy3-free", "nemotron-3.5-lightning-free"]
clinepass = ["cline-pass/deepseek-v4-flash", "cline-pass/minimax-m3"]

[[service]]
name = "claude"
cli = "claude (Opus 5.5 @ high for judgment; Sonnet 5.5 for code; Fable only for frontier)"
good_at = { judgment = 1, frontier = 2, code = 12 }
billing = "subscription"
note = "orchestration pool; Fable is a sublimit of the SAME weekly window (at most 50% of it), not a separate allowance"
judgment_tier = true
access = "cli-only"
# Code on Sonnet 5.5 (operator 2026-10-18: "claude should be in a code pool, it's just fable
# that shouldn't be"); rank 12 keeps the use-it-or-lose-it pools first.
# This replaces the 2026-10-15 "no code row" rule; Fable stays frontier-only. No research row;
# Haiku lookups go through the Agent tool, not acp-dispatch. Fable at xhigh is never suggested:
# acp-dispatch makes it an operator-approved run (2026-10-18).
models = { judgment = "opus --effort high", frontier = "fable --effort high", code = "sonnet --effort high" }

# The Claude Max plan's monthly API credits (an expiring dollar grant; aiuse labels the pool
# "omp credits", provider `omp`), reached through Paseo's omp provider (`acp-dispatch omp`) or
# any ANTHROPIC_API_KEY path. Operator 2026-10-19 lifted the 2026-10-15 per-run gate: a normal
# tier, used with discernment. First for `api-only` work (rank 1),
# otherwise `code` and `bulk` slices so the grant is fully spent before it expires; never left
# unspent. Code ranks behind claude (12) and ahead of
# Cursor. `grant_days` makes the router treat the pool as an expiring grant: it earns the
# burn-first bonus while it holds more than burn_first_waste_min points above an even spend
# over the grant period (a pool far from exhausted late in the month), see route_agent.py.
[[service]]
name = "omp"
retired = true # 2026-11-08: executable retired; Pi Anthropic API acceptance is blocked, not a subscription failure.
cli = "omp (Claude API credits: acp-dispatch omp --model anthropic/claude-sonnet-5-5)"
good_at = { api-only = 1, judgment = 2, code = 13, bulk = 35 }
billing = "credits"
# Adversary rounds and other judgment slices (operator 2026-10-23): Opus 5.5 at high on the API credits
# rather than on the shared Claude weekly window that ran out 2.6 days early on 2026-10-20. Rank 2 puts
# it behind claude (1) in a plain `route`, ahead once claude is drained or an under-spent grant earns
# the burn-first bonus; the bigteam adversary names it explicitly. judgment_tier makes it eligible for
# judgment (frontier stays claude/codex: omp has no frontier row).
judgment_tier = true
note = "Claude Max monthly API credits (expiring grant); API-only work first, then judgment (adversary rounds), else code/bulk so the credits are spent before the reset"
grant_days = 30
# Skipped for acp-dispatch kinds while omp has no enabled Anthropic login (route_agent.py
# omp_anthropic_ready: 2026-10-19 the OAuth refresh token had expired, `omp login` needed).
ready_probe = "omp-anthropic"
max_parallel = 2
access = "cli-only"
models = { api-only = "anthropic/claude-sonnet-5-5 --effort high", judgment = "anthropic/claude-opus-5-5 --effort high", code = "anthropic/claude-sonnet-5-5 --effort high", bulk = "anthropic/claude-haiku-5-5 --effort low" }

[[service]]
name = "codex"
cli = "codex (gpt-6-astra for frontier; gpt-6.1-sol / gpt-6-luna for everyday kinds while quota is plentiful)"
good_at = { frontier = 1, judgment = 3, mechanical = 12, code = 15, bulk = 20 }
billing = "subscription"
note = "frontier: only a slice that really needs astra to look it over; judgment/code/bulk/mechanical on gpt-6.1-sol / gpt-6-luna only while every codex window has >= [routing].plenty_min left (operator 2026-10-25); one at a time"
judgment_tier = true
max_parallel = 1
# Tolerated rather than committed: OpenAI neither permits nor
# prohibits subscription use inside a non-OpenAI tool, and
# tolerated is fine. The real reason to keep it out of Hermes's
# chain is capability, not licensing — these are among the
# strongest coding models available here, so the weekly pool is
# worth reserving for coding judgment rather than spending on
# background agent turns.
access = "cli-only"
# Everyday kinds (operator 2026-10-25: "if we have lots of codex quota and it is the best of
# available options we can use it for non-frontier"): `plenty_kinds` makes those kinds eligible
# only while the pool's tightest window holds at least [routing].plenty_min percent; below it
# (or with no fresh reading) codex is frontier-only again. They rank like any other pool
# (code 15: behind claude, omp and Cursor Auto; opencode-go
# has no code rank since 2026-10-30; mechanical 12, bulk 20: behind the free pools). judgment too (operator 2026-10-25:
# a Codex adversary round was refused; rank 3 behind claude 1 and omp 2, so it is eligible, not
# preferred, on gpt-6.1-sol at high). astra stays frontier-only (`[dispatch].frontier_models`),
# and no research/github row: conservative.
# Models: code on gpt-6.1-sol, the "latest workhorse model for coding and everyday work"
# (the codex model list, 2026-10-25), at medium; bulk and mechanical on gpt-6-luna, "fast and
# affordable ... for easier tasks", at low. No cheaper tier is adequate for code (luna is for
# easier tasks) and nothing here measures the older gpt-6-sol as cheaper.
# 2026-10-18's astra-wave incident: its 5-hour window holds about one hard slice. acp-dispatch
# also reserves in-flight estimates per service. max_parallel = 1 keeps one codex slice per wave.
# 2026-10-19: the plan changed to the $100 plan (aiuse "prolite"); max_parallel = 1
# and the in-flight rule await re-calibration from `route_agent.py calibrate`.
plenty_kinds = ["judgment", "code", "bulk", "mechanical"]
models = { frontier = "gpt-6-astra --effort high", judgment = "gpt-6.1-sol --effort high", code = "gpt-6.1-sol --effort medium", bulk = "gpt-6-luna --effort low", mechanical = "gpt-6-luna --effort low" }

# opencode-zen-free is NOT a separate provider — it is the free subset of
# opencode-zen's models. Kept as its own row because the free and paid
# halves have different billing and different eligibility, which is the
# distinction that actually drives routing. Claude reaches both through
# the `opencode` TUI; Hermes reaches the free half as an API provider.
[[service]]
name = "opencode-zen-free"
retired = true # 2026-11-08: old OpenCode transport retired; Pi Zen credential/route acceptance pending.
cli = "opencode (zen free models)"
good_at = { bulk = 5, mechanical = 5, code = 45 }
billing = "free"
note = "free half of opencode-zen; usable by Claude via the opencode TUI and by Hermes as a direct API provider"
access = "api"
agent = "opencode"

[[service]]
name = "opencode-go"
retired = true # 2026-11-08: old OpenCode transport retired; Pi passed a bounded smoke, automatic routing still pending.
cli = "opencode (go tier)"
# No `code` rank or model (djbclark 2026-10-30): no code slice ever goes to opencode-go, so
# `route`/`plan` never name it for code. DeepSeek V4.1 Flash stays only the main-loop
# substrate model (`route_agent.py substrate`, DANN_SUBSTRATE), never a dispatched code slice.
good_at = { bulk = 2, mechanical = 1 }
billing = "subscription"
note = "Go Plus shares one monthly allowance; bulk and mechanical only, never code; costly models require bounded read-only advice (config/go-model-policy.json)"
agent = "opencode"
models = { bulk = "opencode-go/minimax-m3", mechanical = "opencode-go/gpt-6-luna --effort low" }
# Repo scope (djbclark 2026-11-02): only the techno-euphora project and the Hermes seat may route to this pool. Elsewhere the
# pool is skipped as repo-scoped (no primary, no alternative); acp-dispatch exits 2, route-override included. The transport is
# retired (2026-11-08); the allow-lists stay so a restore keeps the same scope.
allow_repos = ["techno-euphora"]
allow_seats = ["hermes"]

# GrokBot (the cloud Chief of Staff) runs on its own separate Cursor pool since
# 2026-10-18 (operator, after the $60 Cursor plan). aiuse reports it as the separate provider
# `grok-bot` ("Grok Bot Weekly", no cli_binary): it has no [[service]] here and is never a
# routing target ([routing].never_route). The two Cursor services below
# are Cursor Auto and third-party routing, unchanged; do not route into the GrokBot pool.
# Cursor reports two model sublimits of one monthly total: the Auto pool
# (Cursor's own models) and the third-party pool. They drain at very
# different rates (2026-10-15: auto 75% left, third-party 11% left), so
# the Auto pool is its own routing entry; the provider row keeps the rest.
[[service]]
name = "cursor-auto"
cli = "cursor (Auto pool)"
good_at = { code = 14, mechanical = 4, bulk = 6, research = 12 }
billing = "subscription"
note = "Cursor Auto/Composer pool; monthly, use-it-or-lose-it"
burn_first = true
pool = ["cursor", "auto"]
max_parallel = 2
agent = "cursor"
models = { code = "default", mechanical = "default", bulk = "default", research = "default" }

[[service]]
name = "cursor"
cli = "pi (retained Cursor subscription CLI bridge)"
ready_probe = "pi"
good_at = { code = 20, mechanical = 10, bulk = 18, research = 18 }
billing = "subscription"
note = "Composer 2.5 through the retained vendor CLI; Cursor owns inner tools, so direct Pi-hook tasks exclude this route"
agent = "pi"
measured_only = true
burn_first = true
models = { code = "cursor/composer-2.5", mechanical = "cursor/composer-2.5", bulk = "cursor/composer-2.5", research = "cursor/composer-2.5" }

# Pi direct-model profile, 2026-11-08. Ranks are conservative fitness priors, not benchmark scores.
# Flash receives 3x the Coding Plan quota of GLM-5.3; use high for substantive work rather than
# the former blanket low setting. No judgment/frontier claim follows from a basic smoke.
[[service]]
name = "zai"
cli = "pi (Z.ai Coding Plan)"
ready_probe = "pi"
agent = "pi"
good_at = { code = 22, mechanical = 9, bulk = 8, research = 18 }
billing = "subscription"
access = "cli-only"
measured_only = true
max_parallel = 2
note = "Direct Pi tool loop; fresh named Z.ai quota required; no API/subscription or other-account inference"
models = { code = "zai/glm-5.3-flash --effort high", mechanical = "zai/glm-5.3-flash --effort low", bulk = "zai/glm-5.3-flash --effort high", research = "zai/glm-5.3-flash --effort high" }

# Cursor Cloud Agents (bin/cursor-cloud, 2026-10-20; `cursor-cloud launch` directly since the acp-dispatch
# Paseo shim, 2026-11-07, which `route_agent.py` prints as the dispatch line): the slice
# runs in Cursor's cloud and pushes a cursor/... branch; the lead reviews and opens the PR
# (never autoCreatePR). Billed at API price against the same Cursor pool as the third-party
# row (aiuse reports one `cursor` provider; shares_pool copies that reading). Ranked behind
# every local Cursor row and never frontier or judgment: eligible after local agents at the
# same cost tier, and it is no kind's default. Model ids: `bin/cursor-cloud models`.
[[service]]
name = "cursor-cloud"
cli = "cursor-cloud (Cursor Cloud Agents)"
good_at = { code = 24, bulk = 26, mechanical = 18 }
billing = "subscription"
note = "Cursor Cloud Agent: leaves the Mac, pushes a branch, lead opens the PR; API price on the Cursor pool"
shares_pool = "cursor"
max_parallel = 2
models = { code = "claude-sonnet-5-5", bulk = "claude-haiku-5-5", mechanical = "claude-haiku-5-5" }

# The Google AI Pro plan's Gemini 4 Argon window: frontier FALLBACK only (operator 2026-10-31, PR 224). Retired with the
# agy TUI on 2026-11-06 and restored 2026-11-07 (slim-down E7) on Paseo's antigravity provider, because tendcf and nix2cf
# review route 3 (`acp-dispatch antigravity --model gemini-4-argon --kind frontier`, their AGENTS.md) needs a frontier
# row: without one the dispatch is refused as ineligible. aiuse reports the window as pool family `gemini_argon`
# (antigravity/gemini_argon). Used only while codex OR claude is short of quota for `frontier` (`fallback_after`: route()
# skips it otherwise); a fallback with no fresh reading is never used. The acp-dispatch shim (E6) does not apply the
# fallback predicate itself: the lead dispatches Argon only when `route_agent.py plan` names it.
[[service]]
name = "antigravity-argon"
