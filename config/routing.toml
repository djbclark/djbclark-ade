# Machine-readable routing policy. Consumed by bin/route_agent.py and
# bin/acp-dispatch. Edit here; do not restate the data in Python.
# Profiles from docs/model-routing.md "Which AI for which work", rewritten
# 2026-10-15 to the operator's routing policy and narrowed 2026-10-18: Claude
# Fable 5.1 and codex's top frontier model (gpt-6-astra today) are reached
# only through the `frontier` kind, one slice per pool per wave; judgment is
# Opus 5.5 at high; everyday work goes to the OTHER pools, plus codex's everyday
# models (never astra) while its quota is plentiful (`plenty_min`, operator 2026-10-25);
# copilot is the one
# reserve, with a hard floor (GitHub-side Copilot review runs on it; grok is an
# ordinary pool since 2026-10-18, when GrokBot moved to its own Cursor pool);
# hermes is never a target; omp (the Claude API credits) is an ordinary tier since
# 2026-10-19, API-only work first and then code/bulk slices, so the credits are spent
# before they expire each month; cline stays operator-gated.
# `models` is the acp-run `--model [--effort L]` suggestion per kind; `agent`
# is the acp-run agent name when it differs from the aiuse provider id.

[routing]
# Kinds of work. Deliberately few — a taxonomy nobody can apply is worse than
# a coarse one that gets used.
# `api-only` (operator 2026-10-19): work that needs the Claude API and cannot run through a
# TUI or ACP (SDK paths such as the Claude route in bin/failover.py, a verdict classifier,
# a batch or API-only job). Only omp's credits pool is eligible; the caller makes the API
# call itself and `route_agent.py route --kind api-only` says whether the credits have room.
kinds = ["judgment", "frontier", "code", "bulk", "research", "mechanical", "github", "realtime-web", "api-only"]
# burn_first services (use-it-or-lose-it pools) win a tie-sized margin while
# they hold at least this much headroom. Static `burn_first = true` on a
# [[service]] is only a fallback when expected waste at reset is unknown
# (operator /steps 1.6, 2026-10-18: prefer computed burn_first).
burn_first_min = 40.0
burn_first_bonus = 4.0
# Expected unused share of the binding window at reset (percent points). At or
# above this, the pool gets burn_first_bonus even with burn_first = false
# (2026-10-18: codex weekly at 82% left while burning 3.2×; agy Claude/GPT
# weekly hit its cap minutes after a "41% left" reading).
burn_first_waste_min = 30.0
# When the binding window's pace_ratio is above this, add pace_penalty to the
# rank (judgment/frontier take pace_penalty_judgment_factor — capability still
# dominates). 2026-10-18.
pace_penalty_above = 1.5
pace_penalty = 6.0
# Half-penalty factor for judgment/frontier pace (2026-10-18 review finding 5b).
pace_penalty_judgment_factor = 0.5
# Quality band (2026-10-18, plektra lead with djbclark's approval): a code or judgment slice
# never goes to a pool more than this many good_at rank steps worse than the best pool eligible
# for the kind, quota aside (reserves and excluded pools don't set the best). Headroom,
# burn-first and pace reorder pools inside the band; they never pull a much weaker tier in.
# Case: with the r11-r20 code pools at their headroom floors, code went to Gemini Flash (r40).
# Nothing in the band has room: no route (keep it queued until a reset, or exclude by hand).
quality_max_rank_gap = { code = 10, judgment = 10 }
# Most `frontier` slices one wave puts on a single pool (operator 2026-10-18).
frontier_per_wave = 1
# Pools with `plenty_kinds` (codex's everyday kinds, operator 2026-10-25: "if we have lots of codex
# quota and it is the best of available options we can use it for non-frontier") are eligible for
# those kinds only while the binding headroom (the tightest window of the pool, 5-hour and weekly
# alike) is at least this many percent; below it, or with no fresh reading, codex is frontier-only
# again, so a wave cannot empty the 5-hour window the way four astra slices did on 2026-10-18.
plenty_min = 50.0
# Below this much of the Fable sublimit, frontier on claude falls back to Opus.
fable_min_left = 10.0
# Curated profiles overlay discovery; anything discovered without one gets
# default_profile so a newly-added agent is routable rather than invisible.
default_profile = { bulk = 60, mechanical = 60 }

# Calibrate report thresholds (route_agent.py calibrate; monthly AI re-rank).
# Operator /steps 1.5, 2026-10-18: outcome field + AI re-ranking, not human.
[calibrate]
# Minimum finished dispatches in a service×kind before suggesting a rank change.
min_outcomes = 5
# Other services eligible for that kind required before a peer-median suggestion
# (2026-10-18 review finding 3b: a single peer auto-awards ±delta).
min_peers = 2
# Done-rate points below the peer-median for that kind → suggest +5 rank (worse).
suggest_worse_below = 25.0
suggest_worse_delta = 5
# Done-rate points above the peer-median → suggest −3 rank (better).
suggest_better_above = 15.0
suggest_better_delta = 3

[discovery]
# Never a routable service, whatever aiuse or acp-run lists (operator 2026-10-15):
# hermes is the operator's own assistant. omp was gated behind a per-run operator approval
# 2026-10-15..19; the gate is lifted (operator 2026-10-19, see the omp [[service]] below),
# so omp is a curated service now and discovery never needs to guess its profile.
# clinepass: reserved as the lifeline/substrate of BOTH Hermes and Dann (operator 2026-10-23) — never a slice target.
never_route = ["hermes", "clinepass"]
# cline (operator 2026-10-17): the TUI is uninstalled; gated so a reinstall does not put it back
# into discovery by accident (ALIASES folds it into clinepass, which NEVER_ROUTE covers).
operator_gated = ["cline"]
# Discovery names the TUI; aiuse names the account behind it. Without this
# map, discovery would surface `cline` as a brand-new service and hand it bulk
# work — silently defeating the never-bulk rule that protects clinepass, which
# is Hindsight's and hermes's inference lifeline. Any alias inherits the
# curated service's constraints rather than becoming a second entry.
aliases = { cline = "clinepass", agy = "antigravity", claude-agent-teams = "claude", openclaude = "claude", opencode = "opencode-go", kimi = "opencode-go", zcode = "zai", qwen = "alibaba" }

[dispatch]
# Never dispatched without the operator's specific, explicit approval for that run (operator 2026-10-15);
# the same gate is in acp-run.
# hermes (operator 2026-10-15: "hermes should never be used" as a delegation target) needs
# ACP_OPERATOR_APPROVED=<agent>; acp-run applies the same gate. omp left this list on
# 2026-10-19 (its Claude API credits are a normal tier).
# cline (operator 2026-10-17): uninstalled, left in place for a deliberate re-enable; Hermes
# keeps its own ClinePass API pool.
# Distinct from [discovery].operator_gated (dispatch also gates hermes).
operator_gated = ["hermes", "cline"]
# Fable at xhigh/max should almost never run (operator 2026-10-18): the same approval gate, keyed
# ACP_OPERATOR_APPROVED=fable-xhigh. Fable at high is the frontier route_agent.py suggests.
fable_gated_efforts = ["xhigh", "max"]
# Substring match on --model (case-insensitive): these only run with --kind frontier
# (operator 2026-10-18; route-override does not skip this).
frontier_models = ["gpt-6-astra", "fable"]
# Optional hard cap per service (or agent name via ACP_DISPATCH_INFLIGHT). Empty on
# purpose: the in-flight quota reservation replaced `codex = 1` (operator 2026-10-18).
# ACP_DISPATCH_INFLIGHT=name=N still overrides per run (service or agent name).
inflight_cap = {}
# A quota reset further out than this many hours is not waited for (2026-10-18): no
# launchd auto-resume sits around for days (agy's weekly cap resets ~148 h out; codex's
# weekly ~5 days). finalize records a skipped auto-resume and `check` points at a
# reroute instead. aiuse's 30-min back-off guess is never subject to this limit.
auto_resume_max_wait_hours = 6
# Flags a dispatch line needs for acp-run to accept the model at all. crush:
# `--model` rewrites the shared data dir's crush.json, so acp-run exits 2 unless
# the run strips the user config or gets ACP_RUN_CRUSH_DATA (review 2026-10-15).
extra = { crush = " --acp-arg=--strip-user-config" }

# When there is no measured history, floor the brief-size default (operator 2026-10-18:
# gpt-6-astra median 65% of codex's 5-hour window across 4 measured slices).
# 2026-10-19: the codex plan changed (Plus to the $100 plan, aiuse "prolite"); this
# floor awaits re-calibration from `route_agent.py calibrate`. Value unchanged.
# A key `SERVICE:frontier` floors only a slice on a [dispatch].frontier_models model;
# plain `SERVICE` floors every other slice (2026-10-25: codex's everyday models, luna and
# 6.1-sol, are not astra; 10.0 is a guess until `calibrate` has measured slices).
[dispatch.estimate_floor]
"codex:frontier" = 60.0
codex = 10.0
claude = 8.0
antigravity-claude = 15.0

# The orchestrating (lead) session's own model (operator 2026-10-23; incident and rule in
# skills/model-routing/SKILL.md "Lead / orchestrator sessions"). Everything above routes
# dispatched slices; this is the session that dispatches them. `model` at `effort` by default,
# `pipeline_model` at `pipeline_effort` when the session only drives a pipeline (PR loops, waiters,
# merges; djbclark 2026-10-23: Sonnet 5.5 at medium, high only for judgment turns; effort changes on
# 5.5 keep the prompt cache). `pipeline_effort` is optional (default high). Never
# Fable: that is the `fable-deep` sub-agent or a `frontier` slice. Printed by `route_agent.py policy`.
[lead]
model = "opus"
effort = "high"
pipeline_model = "sonnet"
pipeline_effort = "medium"

[escalation]
# Operator 2026-10-18: cheap first; a failed slice climbs one rung, never straight to frontier.
ladder = ["mechanical", "bulk", "code", "judgment", "frontier"]

# Kinds off the ladder land where the operator says, not where an index would put them.
[escalation.next]
research = "judgment"

[hermes]
# Hermes names the provider differently from aiuse for the paid pool.
provider_name = { clinepass = "cline" }
# Concrete models per Hermes-usable provider, cheapest-capable first within
# each. Only providers with access == "api" may appear: everything else is
# reachable solely through its own vendor CLI.

[hermes.models]
opencode-zen-free = ["deepseek-v4-flash-free", "hy3-free", "nemotron-3.5-lightning-free"]
clinepass = ["cline-pass/deepseek-v4-flash", "cline-pass/minimax-m3"]

[[service]]
name = "claude"
cli = "claude (Opus 5.5 @ high for judgment; Sonnet 5.5 for code; Fable only for frontier)"
good_at = { judgment = 1, frontier = 2, code = 12 }
billing = "subscription"
note = "orchestration pool; Fable is a sublimit of the SAME weekly window (at most 50% of it), not a separate allowance"
judgment_tier = true
access = "cli-only"
# Code on Sonnet 5.5 (operator 2026-10-18: "claude should be in a code pool, it's just fable
# that shouldn't be"); rank 12 keeps the use-it-or-lose-it antigravity-claude pool (11) first.
# This replaces the 2026-10-15 "no code row" rule; Fable stays frontier-only. No research row;
# Haiku lookups go through the Agent tool, not acp-dispatch. Fable at xhigh is never suggested:
# acp-dispatch makes it an operator-approved run (2026-10-18).
models = { judgment = "opus --effort high", frontier = "fable --effort high", code = "sonnet --effort high" }

# The Claude Max plan's monthly API credits (an expiring dollar grant; aiuse labels the pool
# "omp credits", provider `omp`), reached through the omp TUI (`acp-run omp`, `omp acp`) or
# any ANTHROPIC_API_KEY path. Operator 2026-10-19 lifted the 2026-10-15 per-run gate: a normal
# tier, used with discernment. First for `api-only` work (rank 1, the only pool in that kind),
# otherwise `code` and `bulk` slices so the grant is fully spent before it expires; never left
# unspent. Code ranks behind the use-it-or-lose-it agy pool (11) and claude (12) and ahead of
# Cursor. `grant_days` makes the router treat the pool as an expiring grant: it earns the
# burn-first bonus while it holds more than burn_first_waste_min points above an even spend
# over the grant period (a pool far from exhausted late in the month), see route_agent.py.
[[service]]
name = "omp"
cli = "omp (Claude API credits: acp-run omp --model anthropic/claude-sonnet-5-5)"
good_at = { api-only = 1, judgment = 2, code = 13, bulk = 35 }
billing = "credits"
# Adversary rounds and other judgment slices (operator 2026-10-23): Opus 5.5 at high on the API credits
# rather than on the shared Claude weekly window that ran out 2.6 days early on 2026-10-20. Rank 2 puts
# it behind claude (1) in a plain `route`, ahead once claude is drained or an under-spent grant earns
# the burn-first bonus; the bigteam adversary names it explicitly. judgment_tier makes it eligible for
# judgment (frontier stays claude/codex: omp has no frontier row).
judgment_tier = true
note = "Claude Max monthly API credits (expiring grant); API-only work first, then judgment (adversary rounds), else code/bulk so the credits are spent before the reset"
grant_days = 30
# Skipped for acp-dispatch kinds while omp has no enabled Anthropic login (route_agent.py
# omp_anthropic_ready: 2026-10-19 the OAuth refresh token had expired, `omp login` needed).
ready_probe = "omp-anthropic"
max_parallel = 2
access = "cli-only"
models = { api-only = "anthropic/claude-sonnet-5-5 --effort high", judgment = "anthropic/claude-opus-5-5 --effort high", code = "anthropic/claude-sonnet-5-5 --effort high", bulk = "anthropic/claude-haiku-5-5 --effort low" }

[[service]]
name = "codex"
cli = "codex (gpt-6-astra for frontier; gpt-6.1-sol / gpt-6-luna for everyday kinds while quota is plentiful)"
good_at = { frontier = 1, mechanical = 12, code = 15, bulk = 20 }
billing = "subscription"
note = "frontier: only a slice that really needs astra to look it over; code/bulk/mechanical on gpt-6.1-sol / gpt-6-luna only while every codex window has >= [routing].plenty_min left (operator 2026-10-25); one at a time"
judgment_tier = true
max_parallel = 1
# Tolerated rather than committed: OpenAI neither permits nor
# prohibits subscription use inside a non-OpenAI tool, and
# tolerated is fine. The real reason to keep it out of Hermes's
# chain is capability, not licensing — these are among the
# strongest coding models available here, so the weekly pool is
# worth reserving for coding judgment rather than spending on
# background agent turns.
access = "cli-only"
# Everyday kinds (operator 2026-10-25: "if we have lots of codex quota and it is the best of
# available options we can use it for non-frontier"): `plenty_kinds` makes those kinds eligible
# only while the pool's tightest window holds at least [routing].plenty_min percent; below it
# (or with no fresh reading) codex is frontier-only again. They rank like any other pool
# (code 15: behind agy's Claude pool, claude, omp and Cursor Auto, ahead of zai and
# opencode-go; mechanical 12, bulk 20: behind the free pools). astra stays frontier-only
# (`[dispatch].frontier_models`), and no research/judgment/github row: conservative.
# Models: code on gpt-6.1-sol, the "latest workhorse model for coding and everyday work"
# (acp-run codex --info, 2026-10-25), at medium; bulk and mechanical on gpt-6-luna, "fast and
# affordable ... for easier tasks", at low. No cheaper tier is adequate for code (luna is for
# easier tasks) and nothing here measures the older gpt-6-sol as cheaper.
# 2026-10-18's astra-wave incident: its 5-hour window holds about one hard slice. acp-dispatch
# also reserves in-flight estimates per service. max_parallel = 1 keeps one codex slice per wave.
# 2026-10-19: the plan changed to the $100 plan (aiuse "prolite"); max_parallel = 1
# and the in-flight rule await re-calibration from `route_agent.py calibrate`.
plenty_kinds = ["code", "bulk", "mechanical"]
models = { frontier = "gpt-6-astra --effort high", code = "gpt-6.1-sol --effort medium", bulk = "gpt-6-luna --effort low", mechanical = "gpt-6-luna --effort low" }

# agy's second pool: Claude Opus/Sonnet 5.5 and GPT via the same Google AI
# Pro subscription, a separate 5h/weekly window from Gemini. Operator
# 2026-10-10: it has a lot of headroom, so use it. Real Claude-class
# coding and review capacity that is otherwise wasted at each reset.
# Reach it ONLY through `acp-run agy --model claude-opus-5-5 --effort high`
# (or claude-sonnet-5-5), never `agy -p`; see model-routing's agy rules.
# Over ACP these ids exist only because acp-run sends clientInfo.name
# "zed": agy_acp_server 1.3.0 gives non-Gemini models only to zed, xcode
# and JetBrains.* clients (supports_third_party_models(), deliberate, so a
# client-name workaround a later .par may close; antigravity-cli#1168).
# acp-dispatch checks --model against `acp-run agy --info` before running.
[[service]]
name = "antigravity-claude"
cli = "agy (acp-run agy --model claude-opus-5-5 --effort high | claude-sonnet-5-5)"
good_at = { code = 11, research = 3, mechanical = 6 }
billing = "subscription"
note = "Claude/GPT pool on the Google AI Pro plan; use-it-or-lose-it, ACP client only"
burn_first = true
pool = ["antigravity", "claude_gpt"]
max_parallel = 3
access = "cli-only"
agent = "agy"
models = { code = "claude-opus-5-5 --effort high", research = "claude-sonnet-5-5 --effort high", mechanical = "claude-sonnet-5-5 --effort low" }

[[service]]
name = "antigravity"
cli = "agy (gemini)"
good_at = { bulk = 1, research = 1, mechanical = 2 }
billing = "subscription"
# Google AI Pro does NOT include API access — subscriptions are chat
# -interface only, and a Gemini API key bills separately. Reaching
# it via the agy CLI spends the subscription; wiring Hermes to a
# GEMINI_API_KEY would spend real money.
note = "big context, summarisation, multimodal; most-wasted pool"
max_parallel = 2
access = "cli-only"
agent = "agy"
# No `code` (2026-10-18, plektra lead with djbclark's approval): Flash is GLM-5.3 / Kimi K2.6
# tier on hard agentic coding (Terminal-Bench 4.0 19.1% vs Sonnet 5.5's 70.6%, FrontierSWE v2
# 19.6% vs 61.9%; benchlm.ai 2026-10-17) and strong only on saturated benchmarks.
models = { bulk = "gemini-3.8-flash --effort medium", research = "gemini-3.8-flash --effort high", mechanical = "gemini-3.8-flash --effort low" }

# opencode-zen-free is NOT a separate provider — it is the free subset of
# opencode-zen's models. Kept as its own row because the free and paid
# halves have different billing and different eligibility, which is the
# distinction that actually drives routing. Claude reaches both through
# the `opencode` TUI; Hermes reaches the free half as an API provider.
[[service]]
name = "opencode-zen-free"
cli = "opencode (zen free models)"
good_at = { bulk = 5, mechanical = 5, code = 45 }
billing = "free"
note = "free half of opencode-zen; usable by Claude via the opencode TUI and by Hermes as a direct API provider"
access = "api"
agent = "opencode"

[[service]]
name = "opencode-go"
cli = "opencode (go tier)"
good_at = { bulk = 2, mechanical = 1, code = 18 }
billing = "subscription"
note = "Go Plus shares one monthly allowance; costly models require bounded read-only advice (config/go-model-policy.json)"
agent = "opencode"
models = { bulk = "opencode-go/minimax-m3", mechanical = "opencode-go/gpt-6-luna --effort low", code = "opencode-go/deepseek-v4.1-flash" }

[[service]]
name = "zai"
cli = "zcode (GLM-5.3)"
good_at = { bulk = 3, mechanical = 3, code = 16, research = 12 }
billing = "subscription"
# zcode (Z.ai's own TUI, GLM-5.3 / GLM-5.3-Flash x low/high/max) is
# the zai Coding Plan's TUI; acp-run zcode drives it.
note = "coding plan; an everyday code and bulk pool"
agent = "zcode"
# zcode lists each model under two providers since 2026-10-18 (builtin:zai\ and
# builtin:zai-coding-plan\), so a bare GLM-5.3 is ambiguous and acp-dispatch refuses it;
# the coding-plan ids are the subscription's.
models = { code = 'builtin:zai-coding-plan\GLM-5.3 --effort high', research = 'builtin:zai-coding-plan\GLM-5.3 --effort high', bulk = 'builtin:zai-coding-plan\GLM-5.3-Flash --effort low', mechanical = 'builtin:zai-coding-plan\GLM-5.3-Flash --effort low' }

# Alibaba's coding plan through the qwen TUI. aiuse keeps `alibaba` under
# [disabled_services] (operator 2026-10-08), so `plan` skips it until the
# operator re-enables it there; the row exists so discovery does not
# surface the bare `qwen` agent as an unprofiled, un-disable-able service.
[[service]]
name = "alibaba"
cli = "qwen (Alibaba coding plan)"
good_at = { bulk = 30, mechanical = 30, code = 30, research = 30 }
billing = "subscription"
note = "disabled in aiuse until the operator re-enables it"
agent = "qwen"
models = { code = "qwen3.8-max --effort medium", research = "qwen3.8-max --effort medium", bulk = "qwen3.8-max --effort low", mechanical = "qwen3.8-max --effort low" }

# MIT SIPB-hosted models through the crush fork (ACP). Free, no quota
# window in aiuse, 30B-class: light bulk and mechanical slices only.
[[service]]
name = "crush"
cli = "crush (SIPB models, free)"
good_at = { bulk = 8, mechanical = 8 }
billing = "free"
note = "MIT SIPB-hosted 30B-class models; light slices only"
models = { bulk = "sipb-llms:qwen3.6:35b-a3b-q4_K_M", mechanical = "sipb-llms:qwen3.6:35b-a3b-q4_K_M" }

[[service]]
name = "devin"
cli = "devin"
good_at = { bulk = 20, code = 45 }
billing = "subscription"
note = "disabled in Orca's roster — dormant by choice"

# RESERVE (operator 2026-10-15: "never deplete the grok and copilot
# pools"; grok released 2026-10-18, copilot stays): GitHub-side Copilot code review of commits draws on this
# allowance. Hard floor, one slice at a time, only for GitHub-shaped work.
[[service]]
name = "copilot"
cli = "copilot"
good_at = { github = 1 }
billing = "subscription"
# GitHub: the Copilot endpoint is for officially supported clients
# only. Using it as a generic model provider violates the ToS and
# risks account suspension. CLI only, never a Hermes provider.
note = "RESERVE: PR review, repo Q&A (official client only)"
access = "forbidden"
reserve_floor = 60.0
max_parallel = 1
models = { github = "claude-sonnet-5.5 --effort medium" }

# GrokBot (the cloud Chief of Staff) runs on its own separate Cursor pool since
# 2026-10-18 (operator, after the $60 Cursor plan), not on the grok TUI's SuperGrok pool.
# aiuse reports it as the separate provider `grok-bot` ("Grok Bot Weekly", no cli_binary):
# it has no [[service]] here and is never a routing target. The two Cursor services below
# are Cursor Auto and third-party routing, unchanged; do not route into the GrokBot pool.
# Cursor reports two model sublimits of one monthly total: the Auto pool
# (Cursor's own models) and the third-party pool. They drain at very
# different rates (2026-10-15: auto 75% left, third-party 11% left), so
# the Auto pool is its own routing entry; the provider row keeps the rest.
[[service]]
name = "cursor-auto"
cli = "cursor (Auto pool)"
good_at = { code = 14, mechanical = 4, bulk = 6, research = 12 }
billing = "subscription"
note = "Cursor Auto/Composer pool; monthly, use-it-or-lose-it"
burn_first = true
pool = ["cursor", "auto"]
max_parallel = 2
agent = "cursor"
models = { code = "default", mechanical = "default", bulk = "default", research = "default" }

[[service]]
name = "cursor"
cli = "cursor (third-party models)"
good_at = { code = 20, mechanical = 10 }
billing = "subscription"
note = "Cursor third-party pool"
agent = "cursor"
models = { code = "claude-sonnet-5-5 --effort medium", mechanical = "claude-haiku-5-5 --effort low" }

# Cursor Cloud Agents (bin/cursor-cloud, `acp-dispatch cursor-cloud`, 2026-10-20): the slice
# runs in Cursor's cloud and pushes a cursor/... branch; the lead reviews and opens the PR
# (never autoCreatePR). Billed at API price against the same Cursor pool as the third-party
# row (aiuse reports one `cursor` provider; shares_pool copies that reading). Ranked behind
# every local Cursor row and never frontier or judgment: eligible after local agents at the
# same cost tier, and it is no kind's default. Model ids: `bin/cursor-cloud models`.
[[service]]
name = "cursor-cloud"
cli = "cursor-cloud (Cursor Cloud Agents)"
good_at = { code = 24, bulk = 26, mechanical = 18 }
billing = "subscription"
note = "Cursor Cloud Agent: leaves the Mac, pushes a branch, lead opens the PR; API price on the Cursor pool"
shares_pool = "cursor"
max_parallel = 2
models = { code = "claude-sonnet-5-5", bulk = "claude-haiku-5-5", mechanical = "claude-haiku-5-5" }

# Ordinary subscription pool (SuperGrok). It was a reserve 2026-10-15..18 because GrokBot
# drew on it; GrokBot moved to its own Cursor pool 2026-10-18 (operator), so the floor and
# the one-slice cap are gone. Ranked behind the burn-first pools (antigravity, cursor-auto).
[[service]]
name = "grok"
cli = "grok"
good_at = { realtime-web = 1, research = 25, bulk = 30 }
billing = "subscription"
note = "SuperGrok subscription; realtime X/web angle first, research and bulk behind the burn-first pools"
models = { realtime-web = "grok-4.7 --effort high", research = "grok-4.7 --effort high", bulk = "grok-4.7-build-fast --effort low" }

[[service]]
name = "clinepass"
cli = "cline"
good_at = { bulk = 40, code = 40, mechanical = 40 }
billing = "subscription"
# An API-key bundle we hold, so Hermes may call it directly. The
# old blanket never_bulk rule was retired 2026-08-24 in favour of
# the measured burn-rate alert (agent_stats.py burn). aiuse's
# [disabled_services] keeps it out of `plan` since 2026-10-08.
note = "Hermes-usable API pool; watch the burn alert"
access = "api"
agent = "cline"
models = { bulk = "cline-pass/deepseek-v4.1-flash", mechanical = "cline-pass/deepseek-v4.1-flash", code = "cline-pass/glm-5.3" }

# The paid half of the same provider. Retired with the prepaid tier, not
# because the provider is unusable — restoring it is a top-up decision.
[[service]]
name = "opencode-zen"
cli = "opencode (zen paid models)"
good_at = { code = 50, bulk = 50 }
billing = "prepaid"
note = "paid half of opencode-zen; prepaid tier retired 2026-08-23"
retired = true
agent = "opencode"

[[service]]
name = "openrouter"
cli = "opencode-ralph-tui-openrouter"
