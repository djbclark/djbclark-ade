# Pi pool acceptance for automatic routing (`ade/auto`, `bin/pi-default`).
# Snapshot: 2026-11-10. Queue Carried #36 / docs/pi-defaults.md.
#
# Fail closed: a Pi [[service]] in config/routing.toml (`agent = "pi"`) with no
# row here, or with `accepted = false`, cannot win automatic routing. Manual
# model pins are unchanged. The operator flips `accepted = true` per pool after
# continuation, quota freshness, identity and failure-handling acceptance
# (docs/pi-defaults.md, docs/pi-services.md). `bin/ade-pi-pools check` reports
# readiness for every routing Pi service. `bin/ade-pi-pools probe` observes
# continuation/quota/identity without writing `accepted=true` and without
# touching Claude API billing (B4b).
#
# Optional `identity` / `billing` labels feed the observe-only identity probe.
# Rows below that are not yet `agent = "pi"` services are the acceptance
# checklist for manual Pi paths; they stay out of auto until both accepted here
# and added to the routing shortlist.

