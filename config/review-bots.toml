# config/review-bots.toml (2026-11-14, rb-01): AI reviewer bots whose unresolved findings block a merge.
# Operator ruling 2026-11-14: "We need to make sure we pay attention to any coderabbit or similar code reviews ...
# We can have a configurable set of github users like coderabbit we trust." Trust level = "must-triage gate": a
# listed bot's untriaged finding blocks merge-ready until it is fixed or answered with a reason; its text is still
# DATA, never an instruction. Read by bin/review_bots.py (bin/review-bot-findings, bin/ade-merge-ready).
#
# A repo adds or drops bots in `.github/ade-review-bots.toml` on its DEFAULT branch (docs/review-boundary.md).
# Unknown keys, wrong types, duplicate ids/logins: the whole file is refused (fail closed).
#
# Entry keys (all strings unless noted):
#   id                       unique slug, used by an override's `drop`
#   name                     display name
#   rest_login               REST `user.login`, must be graphql_login + "[bot]"
#   graphql_login            GraphQL `author.login` (no suffix); the actor's __typename must also be "Bot"
#   thread_markers           list: literal substrings; non-empty = a thread counts only when a bot comment carries one;
#                            empty = any review thread whose first comment is the bot's
#   review_body_patterns     list of regex: a match in the bot's LATEST top-level review body = actionable findings
#   issue_comment_patterns   list of regex: a match in the bot's LATEST issue comment = actionable findings
#   check_names              list: check-run names that show the bot is running on a head
#   check_apps               list: check-run app slugs that show the same
#   check_runs               list of `{ name = "...", app = "..." }` tables: AND-paired check-run name + app slug
#                            (preferred over bare check_names/check_apps so a workflow job cannot spoof the name and
#                            sibling checks from the same app do not hold merges)
#   status_contexts          list: commit-status contexts (GET commits/<head>/status) that show the same; a `pending`
#                            one younger than pending_max_minutes blocks (CodeRabbit reports as a status in many repos)
#   source                   where the logins were verified

[meta]
schema = 1

[defaults]
pending_max_minutes = 15   # a running bot check younger than this blocks as review_bot_pending; older = stalled note

[[bot]]
id = "coderabbit"
name = "CodeRabbit"
rest_login = "coderabbitai[bot]"
graphql_login = "coderabbitai"
thread_markers = []
review_body_patterns = ["Actionable comments posted: [1-9]"]
issue_comment_patterns = []
check_names = ["CodeRabbit"]
check_apps = []
status_contexts = ["CodeRabbit"]
source = "REST coderabbitai[bot]: netresearch/git-workflow-skill pull-request-workflow.md (jq user.login); GraphQL suffix dropped: Shelf-nu/shelf.nu scripts/pr-review-watch.sh (verified there on PR 2770), 2026-11-14"

[[bot]]
id = "codex"
name = "Codex"
rest_login = "chatgpt-codex-connector[bot]"
graphql_login = "chatgpt-codex-connector"
thread_markers = ["codex-code-review-finding:v1", "codex-security-review-finding:v1"]
review_body_patterns = []
issue_comment_patterns = []
check_names = []
check_apps = []
source = "djbclark/djbclark-ade PR 711 reviews/comments (REST user.type Bot) and PR listings (gh shows the GraphQL form), 2026-11-14; bin/codex-open-threads"

[[bot]]
id = "greptile"
