# Macroscope (operator ruling 2026-11-22: trusted like CodeRabbit, must-triage). SCARCE: the workspace holds a US$100
# non-renewable balance billed per KB of reviewed diff, so NOTHING in this repo requests a review (a macroscope-app
# mention comment is the operator's or a lead's deliberate act, skills/macroscope-review; so is a mode label). A PR with no Macroscope check run
# is `not_started`, never pending. Only the Correctness check is listed in check_runs (pinned to app slug macroscopeapp): Approvability (a verdict
# review/comment, no inline threads) and Check Run Agents are not findings and must not hold a merge.
# NOTE the mention handle `macroscope-app` (written with a leading at-sign only in the skill) is NOT the login: the login is `macroscopeapp[bot]` (the `-nonprod` app,
# `macroscopeapp-nonprod[bot]`, is Macroscope's own test app and is not listed).
[[bot]]
id = "macroscope"
name = "Macroscope"
rest_login = "macroscopeapp[bot]"
graphql_login = "macroscopeapp"
thread_markers = []
review_body_patterns = []
issue_comment_patterns = []
check_names = []
check_apps = []
check_runs = [{ name = "Macroscope - Correctness Check", app = "macroscopeapp" }]
source = "REST macroscopeapp[bot] user.type Bot: wave-av/wave-moq-edge PR 149 (issue comment and APPROVED review), good-night-oppie/agentdex-cli PRs 742 and 748 (inline review comments with a severity line, review body macroscope-meta marker); GitHub App slug macroscopeapp (https://github.com/apps/macroscopeapp, owner prassoai; users/macroscopeapp[bot] id 170038800 type Bot); check runs `Macroscope - Correctness Check` / `Macroscope - Approvability Check` app slug macroscopeapp: ardia-browser/ardia PR 3320, Wladefant/speakr PR 11; docs https://docs.macroscope.com/correctness, 2026-11-22"
