# The frontier-model allowance, versioned in git (2026-10-27; docs/gates.md). Read by bin/ade_gates.py `load_frontier`
# for bin/route_agent.py (the planner's per-wave cap), bin/acp-dispatch (the dispatch grant) and
# claude/hooks/frontier_agent_gate.py (Agent-tool frontier calls).
#
# Since 2026-11-07 (slim-down E7) this file holds the frontier half only: the Claude quota gates ([governor],
# [quota_guard], the gate profiles and their floors) were deleted with the fleet governor, the quota guard and the
# gate profile tool. Pausing at a quota limit and resuming after the reset is the session-guard and usage-auto-resume
# Paseo plugins' job; the Claude reading the allowance judges comes from route_agent's merged quota snapshot
# (`aiuse --available --json` plus `paseo usage ls --json`).
#
# The code default (ade_gates.FRONTIER_DEFAULTS) is all-closed: a missing or unreadable file, or a [frontier] table
# holding a non-number, means closed and the hook asks. There is no env override of these numbers.

[frontier]
# The standing allowance (2026-10-27, operator: "Frontier model use should still be open when required").
frontier1_judged = 1               # 1 = an agent may pick the claude frontier model (Fable) on its own judgment, with a reason; 0 = closed
frontier2_judged = 1               # same for the codex frontier model (gpt-6-astra)
frontier1_per_wave = 2             # frontier slices per wave on the claude pool
frontier2_per_wave = 1             # same on the codex pool (astra's 5-hour window holds about one hard slice, 2026-10-18)
frontier1_agent_calls_per_day = 4  # Agent-tool frontier-1 calls allowed without asking, per America/New_York day (0: always ask)
frontier1_min_left = 15.0          # percent of the frontier-1 (Fable) cap that must be left (15 since 2026-11-07: the old guard stopped judged Fable below it)
frontier1_window_min_left = 30.0   # percent left on the tightest Claude window (the old quota guard's tight level: the stop signal)
frontier2_min_left = 60.0          # percent left on the codex binding window before judged frontier-2 use

# -- floors -------------------------------------------------------------------------------------------------------
#
# A "higher is looser" key (every key but `*_min_left`) may sit in [frontier] up to its bound here; a value above the
# bound takes the all-closed code default instead (bin/ade_gates.py `baseline_limit`). A `*_min_left` key is never looser
# (lower) than its code default, whatever this table says. The bounds equal the ruled standing values.

[floors.frontier]
frontier1_judged = { loosen = "higher", bound = 1 }
frontier2_judged = { loosen = "higher", bound = 1 }
frontier1_per_wave = { loosen = "higher", bound = 2 }
frontier2_per_wave = { loosen = "higher", bound = 1 }     # astra's 5-hour window holds about one hard slice (2026-10-18)
frontier1_agent_calls_per_day = { loosen = "higher", bound = 4 }
