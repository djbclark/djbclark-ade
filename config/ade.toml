note = "The newest xAI Grok model on Cursor's third-party model pool (operator 2026-11-21: research lead and reviewer, skills/research 1b). Not the never-routed standalone grok CLI, and never the GrokBot Chief-of-Staff pool (grok-bot stays in never_route)."
shares_pool = "cursor"        # the Cursor third-party pool reading (the `cursor` row), as cursor-cloud does
