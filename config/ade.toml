# --- from config/gates.toml ---
# The frontier-model allowance, versioned in git (2026-10-27; docs/gates.md). Read by bin/ade_gates.py `load_frontier`
# for bin/route_agent.py (the planner's per-wave cap; Choice.dispatch → paseo run)
# and claude/hooks/frontier_agent_gate.py (Agent-tool frontier calls). The acp-dispatch grant path was deleted 2026-11-14.
#
# Since 2026-11-07 (slim-down E7) the gates domain holds the frontier half only: the Claude quota gates ([governor],
# [quota_guard], the gate profiles and their floors) were deleted with the fleet governor, the quota guard and the
# gate profile tool. Pausing at a quota limit and resuming after the reset is the session-guard and usage-auto-resume
# Paseo plugins' job; the Claude reading the allowance judges comes from route_agent's merged quota snapshot
# (`aiuse --available --json` plus `paseo usage ls --json`).
#
# The code default (ade_gates.FRONTIER_DEFAULTS) is all-closed: a missing or unreadable file, or a [frontier] table
# holding a non-number, means closed and the hook asks. There is no env override of these numbers.

[gates.frontier]
# The standing allowance (2026-10-27, operator: "Frontier model use should still be open when required").
frontier1_judged = 1               # 1 = an agent may pick the claude frontier model (Fable) on its own judgment, with a reason; 0 = closed
frontier2_judged = 1               # same for the codex frontier model (gpt-6-astra)
frontier1_per_wave = 2             # frontier slices per wave on the claude pool
frontier2_per_wave = 1             # same on the codex pool (astra's 5-hour window holds about one hard slice, 2026-10-18)
frontier1_agent_calls_per_day = 4  # Agent-tool frontier-1 calls allowed without asking, per America/New_York day (0: always ask)
frontier1_min_left = 15.0          # percent of the frontier-1 (Fable) cap that must be left (15 since 2026-11-07: the old guard stopped judged Fable below it)
frontier1_window_min_left = 30.0   # percent left on the tightest Claude window (the old quota guard's tight level: the stop signal)
frontier2_min_left = 60.0          # percent left on the codex binding window before judged frontier-2 use

# -- floors -------------------------------------------------------------------------------------------------------
#
# A "higher is looser" key (every key but `*_min_left`) may sit in [frontier] up to its bound here; a value above the
# bound takes the all-closed code default instead (bin/ade_gates.py `baseline_limit`). A `*_min_left` key is never looser
# (lower) than its code default, whatever this table says. The bounds equal the ruled standing values.

[gates.floors.frontier]
frontier1_judged = { loosen = "higher", bound = 1 }
frontier2_judged = { loosen = "higher", bound = 1 }
frontier1_per_wave = { loosen = "higher", bound = 2 }
frontier2_per_wave = { loosen = "higher", bound = 1 }     # astra's 5-hour window holds about one hard slice (2026-10-18)
frontier1_agent_calls_per_day = { loosen = "higher", bound = 4 }

# --- from config/model-tiers.toml ---
# Model tiers: roles → concrete models per vendor (docs/history/model-tiers-design.md).
# Snapshot 2026-11-09: projects today's config/ade.toml / route_agent policy tables.
# Edit production via `bin/ade-model-tiers promote|set` in a claimed workspace; merge by PR.
# Untiered pools (minimax, glm, gemini-4-argon, …) stay as literal ids in config/ade.toml [dispatch].

[model_tiers.meta]
schema = 1
updated = "2026-11-13"

# Vendor rank by acclaimed coding quality, best first (operator 2026-10-26).
[model_tiers.rank]
order = ["claude", "codex"]
since = "2026-10-26"
reason = "djbclark 2026-10-26: Fable is the top frontier coding model; codex astra is the acclaimed second"

[model_tiers.vendor.claude]
# A model string belongs here when it matches; an UNKNOWN id that matches is treated as frontier
# (strictest) until promote/set names it.
family = '^(anthropic/|claude/|omp/anthropic/)?(claude-[a-z]+-[0-9][\w.\[\]-]*|opus|sonnet|haiku|fable)$'
roles = { frontier = "claude-fable-5-2", judgment = "claude-opus-5-5", everyday = "claude-sonnet-5-5", bulk = "claude-haiku-5-5" }
spell = { claude = "{alias}", claude-code = "{alias}", paseo = "{id}", omp = "anthropic/{id}", agy = "{id}", cursor = "{id}", copilot = "{id_dotted}" }
cascade = 2
pools = { frontier = { pool_family = "fable", quota_scope = "model_sublimit", label_has = "Fable" } }

# `roles` below name the ids of the 2026-10 snapshot and stay literal on purpose: model_tiers CLASSIFIES an id into a tier
# (frontier_tokens, display); it never picks the model to launch. Launch ids come from the `[[service]].models` families
# (gpt-*-astra, gpt-*-sol), resolved to the newest catalog id by bin/model_family.py, and `[dispatch].frontier_models`
# carries `gpt-*-astra`, so gpt-6.2-astra is frontier the day it resolves (operator 2026-11-21).
[model_tiers.vendor.codex]
family = '^(opencode-go/)?gpt-[0-9][\w.-]*$'
roles = { frontier = "gpt-6-astra", judgment = "gpt-6.1-sol", everyday = "gpt-6.1-sol", bulk = "gpt-6-luna" }
spell = { codex = "{id}", opencode-go = "opencode-go/{id}" }
cascade = 2
pools = {}

[model_tiers.model.claude-fable-5-2]
vendor = "claude"
alias = "fable"
display = "Fable 5.2"

[model_tiers.model.claude-opus-5-5]
vendor = "claude"
alias = "opus"
display = "Opus 5.5"

[model_tiers.model.claude-sonnet-5-5]
vendor = "claude"
alias = "sonnet"
display = "Sonnet 5.5"
spellings = { copilot = "claude-sonnet-5.5" }

[model_tiers.model.claude-haiku-5-5]
vendor = "claude"
alias = "haiku"
display = "Haiku 5.5"

[model_tiers.model.gpt-6-astra]
vendor = "codex"
display = "GPT-6 Astra"

[model_tiers.model."gpt-6.1-sol"]
vendor = "codex"
display = "GPT-6.1 Sol"

[model_tiers.model.gpt-6-luna]
vendor = "codex"
display = "GPT-6 Luna"

# Ids that held a role and no longer do. promote appends here.
[model_tiers.former]
"claude-fable-5-1" = { vendor = "claude", last_role = "frontier", until = "2026-11-13" }

# --- from config/install.toml ---
# Install catalog values (legacy schema_version=1), captured 2026-11-09.
# Production authority is config/ade.toml [install] and [keys]. Values are references and recipes, never secret values.
# install/update/probe = "UNKNOWN" means not yet recorded. presence = PATH basename fallback for doctor.
# install_argv / probe_argv = argv lists (tokens: {bin} {root} {home} {prefix}); doctor prefers probe_argv.
# probe_warn_exit = nonzero probe exits that mean "advisory issues" -> warn (doctor exit 0) when probe_summary_re matches a stdout line; else error.
# probe_summary_re = regex; the first output line matching it is the doctor detail (default: first line with a letter or digit).
# needs_system = true means package-manager/root; bounded apply refuses without a later --system unit.
# chosen is required for offered/optional; hard components are always expected.


# --- hard ---

[[install.component]]
id = "just"
class = "hard"
summary = "Recipe runner; bootstrap installs it if missing"
source = "https://github.com/casey/just"
install = "ade-user-install just (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
update = "ade-user-install just (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
probe = "just --version"
probe_argv = ["just", "--version"]
presence = "just"
platforms = ["mac", "linux"]

[[install.component]]
id = "git"
class = "hard"
summary = "Source control"
install = "apt-get install -y git (Linux); brew install git (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "git"]
system_argv_darwin = ["brew", "install", "git"]
update = "package manager"
probe = "git --version"
probe_argv = ["git", "--version"]
presence = "git"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew. Preview with apply --system --dry-run or --print-system-argv; live needs --yes --system --apply-system."

[[install.component]]
id = "gh"
class = "hard"
summary = "GitHub CLI"
source = "https://cli.github.com"
install = "apt-get install -y gh (Linux); brew install gh (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "gh"]
system_argv_darwin = ["brew", "install", "gh"]
update = "package manager"
probe = "gh --version"
probe_argv = ["gh", "--version"]
presence = "gh"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew."

[[install.component]]
id = "uv"
class = "hard"
summary = "Python tool runner used by bin/pytest and install paths"
source = "https://github.com/astral-sh/uv"
install = "ade-user-install uv (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
update = "ade-user-install uv (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
probe = "uv --version"
probe_argv = ["uv", "--version"]
presence = "uv"
platforms = ["mac", "linux"]

[[install.component]]
id = "sudo-secretspec"
class = "hard"
summary = "Only way a key reaches a tool (review rule 3)"
source = "https://github.com/frdminc/sudo-secretspec"
install = "Mac: brew install frdminc/sudo-secretspec/sudo-secretspec. Linux x86_64: ade-user-install sudo-secretspec resolves releases/latest → versioned tarball + .sha256 → verify → extract media; opt-in sudo ./libexec/sudo-secretspec install --declarations PATH (packaging/README; Debian 12/13, Ubuntu 24.04+)"
needs_system = true
install_argv = ["{bin}/ade-user-install", "sudo-secretspec", "--prefix", "{prefix}"]
system_argv_darwin = ["brew", "install", "frdminc/sudo-secretspec/sudo-secretspec"]
update = "Mac: brew upgrade then interactive sudo-secretspec install from the new stage. Linux: ade-user-install sudo-secretspec again (re-fetch) then re-run libexec install from the new media (not from the installed client)"
update_argv = ["{bin}/ade-user-install", "sudo-secretspec", "--prefix", "{prefix}"]
probe = "sudo-secretspec doctor"
probe_argv = ["sudo-secretspec", "doctor"]
presence = "sudo-secretspec"
platforms = ["mac", "linux"]
notes = "Hard by operator ruling 2026-11-07. Package install ≠ privilege boundary: interactive `sudo-secretspec install --declarations` stays opt-in (`ade-user-install sudo-secretspec --declarations PATH --run-install`). Linux system_argv remains absent (2026-11-10): multi-step versioned asset — no single apt/brew argv and no pinned download URL; plan/apply fall through to install_argv on Linux when brew/system_argv is absent. Runtime apt deps only: sudo libsqlite3-0. Preview Mac brew with apply --system --dry-run."
