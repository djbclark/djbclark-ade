# config/ade.toml — schema_version=1 unified ADE config (folded 2026-11-09; install 2026-11-10).
# Canonical repo base when present (docs/config-migration.md). Legacy split TOMLs
# (routing/gates/context-budget/secret-deny/pr-policy/install) remain for fallthrough
# when this file is absent. Install/keys fold under [install] from config/install.toml.
# Regenerate from legacy with: ade-config fold --write
# Edit scalars with: ade-config set PATH VALUE --target repo

schema_version = 1

[routing]
kinds = [ "judgment", "frontier", "code", "bulk", "research", "mechanical", "github", "realtime-web", "api-only" ]
burn_first_min = 40.0
burn_first_bonus = 4.0
burn_first_waste_min = 30.0
pace_penalty_above = 1.5
pace_penalty = 6.0
pace_penalty_judgment_factor = 0.5
quality_max_rank_gap = { code = 10, judgment = 10 }
plenty_min = 50.0
default_profile = { bulk = 60, mechanical = 60 }
never_route = [ "hermes", "clinepass", "antigravity", "alibaba", "devin", "copilot", "pi", "crush", "kiro", "cline", "agy", "qwen", "goose", "zcode", "muse", "aider", "venicecode", "grok", "grok-bot" ]
aliases = { claude-agent-teams = "claude", openclaude = "claude", opencode = "opencode-go", kimi = "opencode-go" }

[calibrate]
min_outcomes = 5
min_peers = 2
suggest_worse_below = 25.0
suggest_worse_delta = 5
suggest_better_above = 15.0
suggest_better_delta = 3

[dispatch]
operator_gated = [ "hermes" ]
fable_gated_efforts = [ "xhigh", "max" ]
frontier_models = [ "gpt-6-astra", "fable", "gemini-4-argon" ]
inflight_cap = {}
extra = {}
estimate_floor = { "codex:frontier" = 60.0, "codex:judgment" = 25.0, codex = 10.0, claude = 8.0 }
repo_overrides = { tendcf = { estimate_floor = { "codex:frontier" = 20.0 } }, nix2cf = { estimate_floor = { "codex:frontier" = 20.0 } } }

[lead]
model = "opus"
effort = "high"
pipeline_model = "sonnet"
pipeline_effort = "medium"
fable_lead = true

[substrate]
lifeline = [ "clinepass" ]

[hermes]
provider_name = { clinepass = "cline" }
models = { opencode-zen-free = [ "deepseek-v4-flash-free", "hy3-free", "nemotron-3.5-lightning-free" ], clinepass = [ "cline-pass/deepseek-v4-flash", "cline-pass/minimax-m3" ] }

[gates]
[gates.frontier]
frontier1_judged = 1
frontier2_judged = 1
frontier1_per_wave = 2
frontier2_per_wave = 1
frontier1_agent_calls_per_day = 4
frontier1_min_left = 15.0
frontier1_window_min_left = 30.0
frontier2_min_left = 60.0

[gates.floors]
[gates.floors.frontier]
frontier1_judged = { bound = 1, loosen = "higher" }
frontier2_judged = { bound = 1, loosen = "higher" }
frontier1_per_wave = { bound = 2, loosen = "higher" }
frontier2_per_wave = { bound = 1, loosen = "higher" }
frontier1_agent_calls_per_day = { bound = 4, loosen = "higher" }

[context_budget]
dirs = [ "~/src/djbclark-ade", "~" ]

[context_budget.budget]
total = 30000
memory = 10000
skills = 7500
mcp_tools = 6500
mcp_instructions = 5000
grow_alert = 2000
"~" = { memory = 12000 }

[secret_deny]
version = 1
deny = [ ".env", ".env.*", "*.key", "*.p12", "*.pfx", "*-key.pem", "*.key.pem", "privkey*.pem", "id_rsa", "id_ecdsa", "id_ed25519", "~/.ssh/**", "~/.aws/credentials", "~/.netrc", "~/.config/gh/hosts.yml", "~/.docker/config.json", "~/.kube/config" ]
allow = [ ".env.example", ".env.sample", ".env.template", "*.pub", "~/.ssh/known_hosts", "~/.ssh/config" ]

[secret_deny.claude]
static = [ ".env", "*.key", "*.p12", "*.pfx", "*-key.pem", "*.key.pem", "privkey*.pem", "id_rsa", "id_ecdsa", "id_ed25519", "~/.ssh/id_rsa", "~/.ssh/id_ecdsa", "~/.ssh/id_ed25519", "~/.aws/credentials", "~/.netrc", "~/.config/gh/hosts.yml", "~/.docker/config.json", "~/.kube/config" ]

[pr_policy]
[pr_policy.meta]
schema = 1

[pr_policy.github]
token_secret = "GITHUB_TOKEN"
owners = [ "djbclark", "frdminc" ]
policy = "collaborators_only"
exempt_repos = []
trusted_authors = []
approved_label = "pr-policy-approved"

[pr_policy.forgejo]
host = "forgejo.mit.edu"
token_secret = "DJBCLARK_FORGEJO_MIT_EDU_TOKEN"
owners = [ "djbclark" ]
draft_prefix = "WIP: "
exempt_repos = []
trusted_authors = []
approved_label = "pr-policy-approved"

[install]
schema_version = 1

[[install.component]]
id = "just"
class = "hard"
summary = "Recipe runner; bootstrap installs it if missing"
source = "https://github.com/casey/just"
install = "ade-user-install just (GitHub release → ~/.local/bin)"
install_argv = [ "{bin}/ade-user-install", "just", "--prefix", "{prefix}" ]
update = "ade-user-install just (re-fetch latest release)"
update_argv = [ "{bin}/ade-user-install", "just", "--prefix", "{prefix}" ]
probe = "just --version"
probe_argv = [ "just", "--version" ]
presence = "just"
platforms = [ "mac", "linux" ]

[[install.component]]
id = "git"
class = "hard"
summary = "Source control"
install = "apt-get install -y git (Linux); brew install git (Mac)"
needs_system = true
system_argv = [ "apt-get", "install", "-y", "git" ]
system_argv_darwin = [ "brew", "install", "git" ]
update = "package manager"
probe = "git --version"
probe_argv = [ "git", "--version" ]
presence = "git"
platforms = [ "mac", "linux" ]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew. Preview with apply --system --dry-run."

[[install.component]]
id = "gh"
class = "hard"
summary = "GitHub CLI"
source = "https://cli.github.com"
install = "apt-get install -y gh (Linux); brew install gh (Mac)"
needs_system = true
system_argv = [ "apt-get", "install", "-y", "gh" ]
system_argv_darwin = [ "brew", "install", "gh" ]
update = "package manager"
probe = "gh --version"
probe_argv = [ "gh", "--version" ]
presence = "gh"
platforms = [ "mac", "linux" ]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew."

[[install.component]]
id = "uv"
class = "hard"
summary = "Python tool runner used by bin/pytest and install paths"
source = "https://github.com/astral-sh/uv"
install = "ade-user-install uv (GitHub release → ~/.local/bin)"
install_argv = [ "{bin}/ade-user-install", "uv", "--prefix", "{prefix}" ]
update = "ade-user-install uv (re-fetch latest release)"
update_argv = [ "{bin}/ade-user-install", "uv", "--prefix", "{prefix}" ]
probe = "uv --version"
probe_argv = [ "uv", "--version" ]
presence = "uv"
platforms = [ "mac", "linux" ]

[[install.component]]
id = "sudo-secretspec"
class = "hard"
summary = "Only way a key reaches a tool (review rule 3)"
source = "https://github.com/frdminc/sudo-secretspec"
install = "brew install frdminc/sudo-secretspec/sudo-secretspec (Mac); Linux: release tarball installer (packaging/README)"
needs_system = true
system_argv_darwin = [ "brew", "install", "frdminc/sudo-secretspec/sudo-secretspec" ]
update = "brew upgrade (Mac) then interactive sudo-secretspec install; Linux tarball UNKNOWN for argv"
probe = "sudo-secretspec doctor"
probe_argv = [ "sudo-secretspec", "doctor" ]
presence = "sudo-secretspec"
platforms = [ "mac", "linux" ]
notes = "Hard by operator ruling 2026-11-07. Package install ≠ privilege boundary: interactive `sudo-secretspec install` is a later unit. Linux system_argv still UNKNOWN (tarball). Preview Mac brew with apply --system --dry-run."

[[install.component]]
id = "aiuse"
class = "hard"
summary = "Quota reading for routing"
source = "https://github.com/djbclark/aiuse"
install = "uv tool install git+https://github.com/djbclark/aiuse"
install_argv = [ "uv", "tool", "install", "git+https://github.com/djbclark/aiuse" ]
update = "uv tool upgrade aiuse"
update_argv = [ "uv", "tool", "upgrade", "aiuse" ]
probe = "aiuse --help"
probe_argv = [ "aiuse", "--help" ]
presence = "aiuse"
platforms = [ "mac", "linux" ]
notes = "Hard by operator ruling 2026-11-07; user-scoped via uv tool"

