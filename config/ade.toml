schedule = "StartInterval 900"
command = "bin/ade-pin-sweep"
set = ["__STATE__={home}/.local/state/djbclark-ade/pin"]
platforms = ["mac"]
notes = "Non-worker pin sweep (2026-11-20, updated 2026-11-23, operator request): first runs bin/ade-archive-retired --apply (safely re-archiving idle/closed RETIRED tabs and completed-handoff predecessors that Paseo un-archived on a late message), then re-applies the `ade.interactive=1` agent label (bin/ade-pin-interactive, skipping archived, RETIRED, and completed-handoff agents) and the native sidebar pin (bin/ade-pin-workspaces pin, the UI's workspace.pin.set.request RPC through the stdlib daemon client, skipping worker boxes and RETIRED windows) so a new lead or operator-started agent is pinned within 15 minutes. Zero-token; all three steps idempotent."

