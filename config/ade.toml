cli = "pi (Z.ai Coding Plan)"
ready_probe = "pi"
agent = "pi"
# No `code` rank since 2026-11-21 (operator, Neon A7/H3: cheap models stay on bulk and mechanical work a stronger model reviews).
good_at = { mechanical = 9, bulk = 8, research = 18 }
billing = "subscription"
access = "cli-only"
measured_only = true
max_parallel = 2
note = "Direct Pi tool loop; fresh named Z.ai quota required; no API/subscription or other-account inference"
models = { mechanical = "zai/glm-5.3-flash --effort low", bulk = "zai/glm-5.3-flash --effort high", research = "zai/glm-5.3-flash --effort high" }

# Cursor Cloud Agents (bin/cursor-cloud, 2026-10-20; `cursor-cloud launch` directly since the acp-dispatch
# Paseo shim, 2026-11-07, which `route_agent.py` prints as the dispatch line): the slice
# runs in Cursor's cloud and pushes a cursor/... branch; the lead reviews and opens the PR
# (never autoCreatePR). Billed at API price against the same Cursor pool as the third-party
# row (aiuse reports one `cursor` provider; shares_pool copies that reading). Ranked behind
# every local Cursor row and never frontier or judgment: eligible after local agents at the
# same cost tier, and it is no kind's default. Model ids: `bin/cursor-cloud models`.
[[service]]
name = "cursor-cloud"
cli = "cursor-cloud (Cursor Cloud Agents)"
good_at = { code = 24, bulk = 26, mechanical = 18, research = 22 }
billing = "subscription"
note = "Cursor Cloud Agent: leaves the Mac, pushes a branch, lead opens the PR; API price on the Cursor pool"
shares_pool = "cursor"
max_parallel = 2
models = { code = "claude-sonnet-5-5", bulk = "claude-haiku-5-5", mechanical = "claude-haiku-5-5", research = "claude-sonnet-5-5" }

# The Gemini 4 Argon window (Google AI Pro until 2026-11-21; on the Ultra 20x plan every Gemini model, Argon included, draws the one shared
# `google:gemini` pool and this row has no reading of its own, docs/dated-quota-overrides.md 1.2/1.3): the frontier FALLBACK, and since 2026-11-16 a research
# pool too (research 24, behind cursor, zai and cursor-cloud as well as behind codex/claude via
# `fallback_after`). Both roles share one Google plan window, so Argon research competes with Argon
# frontier. Retired with the
# agy TUI on 2026-11-06 and restored 2026-11-07 (slim-down E7) on Paseo's antigravity provider, because tendcf and nix2cf
# review route 3 (written as `acp-dispatch antigravity --model gemini-4-argon --kind frontier` in their AGENTS.md; the
# shim is gone, 2026-11-14, and those files still need updating) needs a frontier row: without one `route_agent.py plan` refuses it as ineligible. aiuse reports the window as pool family `gemini_argon`
# (antigravity/gemini_argon). `fallback_after` gates EVERY requested kind, not only `frontier`, and it blocks Argon only
# while BOTH codex and claude can take the requested kind; if either cannot, Argon enters the candidates. Once admitted,
# structural sorting places it behind any named predecessor still in the candidate list, and `fallback_kinds` makes
# it a last resort behind every other research pool as well. Both roles spend the same weekly window; a fallback with
# no fresh reading is never used. No launcher applies the fallback predicate
# itself (the acp-dispatch shim that once could is gone): the lead dispatches Argon only when `route_agent.py plan` names it.
[[service]]
name = "antigravity-argon"
cli = "antigravity (Gemini 4 Argon; frontier fallback behind codex's newest astra and Fable; research behind every other research pool)"
good_at = { frontier = 5, research = 24 }
billing = "subscription"
note = "Gemini 4 Argon, Google AI Pro window until 2026-11-21 (Ultra 20x since: one shared google:gemini pool, no Argon reading, so this row fails closed); up to 512K context in Antigravity (1M is the API figure); own weekly window; frontier fallback (blocked while both codex and claude can, operator 2026-10-31) and a last-resort research pool since 2026-11-16, both out of that one window"
judgment_tier = true
pool = ["antigravity", "gemini_argon"]
fallback_after = ["codex", "claude"]
# research is a structural last resort too: rank 24 orders equal-pressure candidates but
# cannot beat a usable pool that is merely headroom-penalised (r8 A7).
fallback_kinds = ["research"]
window = "Gemini 4 Argon weekly"
max_parallel = 1
access = "cli-only"
agent = "antigravity"
# Paseo's antigravity provider exposes bare model ids with `thinkingOptionIds` (`paseo provider models antigravity`:
# `gemini-4-argon` + `thinkingOptionIds: ["low", "medium", "high", "xhigh"]`), so `--effort high` maps to `--thinking high`.
models = { frontier = "gemini-*-argon --effort high", research = "gemini-*-argon --effort high" }

[[service]]
