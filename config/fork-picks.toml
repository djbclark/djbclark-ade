# cherry-picks the active (queued or carried) entries for T. Edit status with
# `ade-fork-picks mark` in a worktree. Fields: id (kebab, unique), component (an
# id in config/forks.toml), repo (OWNER/NAME or https GitHub URL; optional with
# local_path), exactly one source of commit (40-hex) / branch / pr (number),
# intent (one line), target or targets (PLATFORM-build-N; build 1 = the installed
# 0.17.1 cutover), status (queued | carried | landed:N | landed:main | upstreamed
# | dropped), optional: upstream URL, order, notes, local_path, expected_head,
# trial_required, hold.
