# Shared MCP servers and the agent clients that must register them
# (docs/mcp-servers.md). Read by `ade-install doctor` (bin/ade_mcp_clients.py),
# which only OBSERVES each client's config file and prints the fix command;
# it never edits ~/.claude.json or ~/.codex/config.toml (standing order 11).
# Client ids: claude-code (user-scope `mcpServers` in ~/.claude.json),
# codex (`[mcp_servers.<id>]` in ~/.codex/config.toml).
schema_version = 1

[[server]]
id = "firecrawl"
url = "http://127.0.0.1:18804/mcp"
clients = ["claude-code", "codex"]

[[server]]
id = "basic-memory"
url = "http://127.0.0.1:18796/mcp"
clients = ["claude-code", "codex"]
