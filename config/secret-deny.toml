# Secret-file read-deny policy: the one copy (2026-11-04, issue #284 item 2; docs/secret-deny.md).
#
# Change it here, run `bin/render-secret-deny`, and commit this file together with what it writes:
# config/secret_deny_policy.json (read by claude/hooks/secret_read_gate.py) and the Read(...)/Edit(...) entries of
# permissions.deny in agents/claude/settings.json.tmpl. `bin/render-secret-deny --check` exits 1 on drift.
#
# Pattern forms (render refuses anything else):
#   name-or-glob   no `/`: that file name in any directory (`.env`, `*.key`)
#   **/a/b         any depth
#   ~/a/b          under the home directory
#   /a/b           absolute
# `*` and `?` stop at `/`; `**` crosses it; `dir/**` also covers the directory itself (a Grep or tar root).
# Not allowed: `[...]`, `{...}`, a leading `!`, parentheses, backslashes, whitespace.
# An allow pattern wins over a deny pattern for the same path; every path (as given, absolute, realpath) is checked
# on its own, so a symlink named `x.pub` that points at a private key is still blocked.
version = 1

deny = [
  ".env",
  ".env.*",
  "*.key",
  "*.p12",
  "*.pfx",
  # Private keys in PEM form, by their usual names. Not every `*.pem`: CA bundles (/etc/ssl/certs/*.pem,
  # cacert.pem) are public and tools read them all the time.
  "*-key.pem",
  "*.key.pem",
  "privkey*.pem",
  "id_rsa",
  "id_ecdsa",
  "id_ed25519",
  "~/.ssh/**",
  "~/.aws/credentials",
  "~/.netrc",
  "~/.config/gh/hosts.yml",
  "~/.docker/config.json",
  "~/.kube/config",
]

allow = [
  ".env.example",
  ".env.sample",
  ".env.template",
  "*.pub",
  "~/.ssh/known_hosts",
  "~/.ssh/config",
]

[claude]
# Rendered as Read(...) and Edit(...) entries in permissions.deny of the Claude settings template (render owns every
# Read(/Edit( entry there). Each must lie inside a deny pattern above and share no path with any allow pattern; render
# checks both. Claude's `!` negation is unverified here and cannot reach `~/` rules, so a deny pattern with an exception
# (`.env.*` vs `.env.example`, `~/.ssh/**` vs `*.pub`/known_hosts/config) is enforced by the hook alone, and the
# narrower exception-free paths inside it are listed instead (`~/.ssh/id_*` would also deny `id_*.pub`).
# Claude reads a pattern with no `/` relative to the session's directory at any depth, so the three key names are
# listed under ~/.ssh as well.
static = [
  ".env",
  "*.key",
  "*.p12",
  "*.pfx",
  "*-key.pem",
  "*.key.pem",
  "privkey*.pem",
  "id_rsa",
  "id_ecdsa",
  "id_ed25519",
  "~/.ssh/id_rsa",
  "~/.ssh/id_ecdsa",
  "~/.ssh/id_ed25519",
  "~/.aws/credentials",
  "~/.netrc",
  "~/.config/gh/hosts.yml",
  "~/.docker/config.json",
  "~/.kube/config",
]
