# Canonical MCP server registry for this machine (docs/mcp-on-demand.md §2.2).
#
# Read by:
#   - `ade-install doctor` (bin/ade_client_wiring.py): observe-only drift checks against `expected`
#   - `bin/mcp-find`: read-only capability lookup across clients
#   - `bin/mcp-registry --md`: generates the inventory table in docs/mcp-on-demand.md §2.1
#
# Rules:
#   - `id` matches the client config key.
#   - `auth.keys` holds key NAMES only, never raw secret values.
#   - `expected` maps TUI ids from bin/skill-everywhere to:
#     user | user-lazy | on-demand | denied | absent | project:<path>
#   - `[server.measured]` holds tool-measured footprint and 30-day usage snapshots.

schema_version = 1

[[server]]
id = "basic-memory"
transport = "local-http"
url = "http://127.0.0.1:18796/mcp"
owner = "launchd:com.djbclark.basic-memory-mcp"
state = "shared-safe"
auth = { kind = "none", keys = [], store = "none" }
capabilities = ["notes", "memory", "knowledge-base"]
expected = { claude = "user", codex = "user", cursor-agent = "user", hermes = "user" }
doc = "docs/mcp-servers.md#roster"
notes = "Shared loopback daemon; default project is main. One process serves every client."

[server.measured]
footprint_mb = 619
measured_at = "2026-11-21"
usage_30d = { claude_calls = 32, claude_sessions = 22, codex_calls = 2, codex_sessions = 1 }

