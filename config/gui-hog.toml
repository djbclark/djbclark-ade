# GUI-hog dialog (docs/gui-hog-dialog.md; PR 3a = data and dry-run trigger; PR 3c adds [freeze]).
# Read by bin/gui_hog.py. ~/.config/load-watch/gui-hog.toml may ADD to [protected], never remove from it or from the
# hard floor in code (pid 1 and other users, WindowServer, Dock, loginwindow, Finder, SystemUIServer, Control Center,
# WindowManager, anything under /System or /usr, the dialog itself; `bg` and agent CLIs are builds, matched by argv, not apps). LW_GUI_HOG=0 turns the
# whole thing off (no app window, no trigger).

[trigger]
hold_s = 180            # a build must have been refused this long under `admit --wait` (B1, C4a)
min_cores = 0.75        # sum over non-build, non-protected apps of their 5-min mean cores (K2: a sum)
min_rss_mb = 2048       # or the sum of their RSS (shared pages double-count, so this fires early)
rate_s = 1800           # at most one dialog per 30 min
snooze_s = 3600         # what Ignore sets (read from gui-hog/snooze.json; the dialog writes it in PR 3b)
window_s = 300          # the mean window for cores
min_row_cores = 0.05    # a row is listed above this many cores ...
min_row_rss_mb = 200    # ... or this much RAM
# gates that quitting a desktop app can relieve; the agent cap and the reservation cap do not (C4b)
relievable = ["load", "compressor", "free_mem", "pageins", "swapins"]

# Protection is by bundle id, bundle-id prefix, bundle path or executable path, never by display name (J3).
# A bundle id was checked against the installed Info.plist or `lsappinfo` on 2026-11-14 where the app is installed;
# apps that are not installed are protected by path or by a documented id namespace instead of a guessed id.
[protected]
bundle_ids = [
  "sh.paseo.desktop", "sh.paseo.desktop.helper",                       # Paseo (the agent harness)
  "com.mitchellh.ghostty", "com.apple.Terminal", "com.googlecode.iterm2",   # terminals
  "com.nousresearch.hermes.setup", "com.hermesdesktop.app",            # Hermes
  "io.tailscale.ipn.macsys",                                           # VPN
  "com.apple.CoreSimulator.CoreSimulatorService", "com.apple.CoreSimulator.SimulatorTrampoline",
  "com.apple.iphonesimulator",                                         # Simulator (started by simctl / xcodebuild, ppid 1)
  "com.apple.dt.Xcode",                                                # in-bundle toolchain (C4b)
  "com.google.android.studio",                                         # bundles a JDK (C4b)
  "com.apple.Virtualization.VirtualMachine", "com.github.cirruslabs.tart",   # VM hosts
  "com.1password.1password",                                           # password manager
  "us.zoom.xos",                                                       # conferencing
]
# JetBrains IDEs bundle a JDK (C4b); `com.jetbrains.` is JetBrains' own namespace.
bundle_id_prefixes = ["com.jetbrains."]
bundle_paths = [
  "/Applications/Ghostty.app", "/Applications/iTerm.app", "/Applications/WezTerm.app", "/Applications/kitty.app",
  "/Applications/Tailscale.app", "/Applications/WireGuard.app",
  "/Applications/Docker.app", "/Applications/OrbStack.app",
  "/Applications/Xcode.app", "/Applications/Android Studio.app", "/Applications/Simulator.app",
  "/Applications/Paseo.app", "/Applications/Hermes.app", "/Applications/HermesDesktop.app",
]
exe_paths = []

# Freeze (PR 3c, docs/gui-hog-dialog.md section F). SIGSTOP of an app's whole process tree, on an operator click or, for the apps listed in
# [freeze.auto] below, by the sampler while a build is held (B6 amended 2026-11-21); resuming is always automatic. `enabled = false` hides the Freeze buttons and makes `gui-hog freeze` refuse (exit 6): the rollback of I3.
# It does not touch `gui-hog thaw`, which keeps working so nothing can be left stopped.
[freeze]
enabled = true
default_minutes = 10    # a timed freeze resumes by itself (the sampler's tick runs `thaw --due`)
max_minutes = 1440      # the longest timed freeze `--minutes` accepts
passes = 3              # rescans for helpers forked mid-freeze (F4d)
lock_timeout_s = 5      # flock on frozen.lock (F1)

# Auto-freeze list (operator ruling 2026-11-21, B6 amended): when a build is held by the GUI-hog trigger (refused for hold_s on a gate desktop apps can
# relieve), the sampler freezes the FIRST running app of `order` (bundle ids, preferred first), one per 20 s tick, timed like a click (`minutes`, default
# [freeze] default_minutes) and logged `by: "auto"`; it stops when the hold ends or no listed app is left. Unlisted apps still need a click, and
# [protected] and the hard floor always win (a protected app is never auto-frozen). An app is skipped while idle (under min_cores of freeable cores), part
# of a build, or frozen by us within refreeze_s (so an operator's Resume sticks for an hour). ~/.config/load-watch/gui-hog.toml may set `[freeze.auto]`
# (order, enabled, minutes, min_cores, refreeze_s) and add to `[freeze.keep_running]`; `LW_GUI_HOG_AUTO=0` turns only this off.
# The list lives here, not in the overlay: the operator named these three apps for this machine, and [protected] already carries machine-specific apps.
# The dialog's "Ignore 1 h" pauses auto-freeze too. The overlay can switch `enabled` off, never back on. Costs while frozen (docs/gui-hog-dialog.md P6, the
# operator decides): CodexBar's CLI has a stderr pipe into the stopped main process (unproven for a full freeze); Beeper's local API (127.0.0.1:23373, the
# `beeper` MCP server) hangs until the freeze ends.
[freeze.auto]
enabled = true
order = [
  "com.steipete.codexbar",            # CodexBar: a menu-bar UI; its HTTP server (the CodexBarCLI helper) keeps running (keep_running below)
  "com.automattic.beeper.desktop",    # Beeper Desktop
  "com.anysphere.sand",               # Grok Bot
]
min_cores = 0.05
refreeze_s = 3600

# Processes of an app that a freeze never stops (manual or auto), by path inside the bundle, matched on the kernel executable path (never argv alone), and
# every descendant of one. aiuse reads CodexBar's local HTTP server (`CodexBarCLI serve --host 127.0.0.1 --port 10546`, [collectors.codexbar] http_url):
# freezing the whole group stopped it too (events.jsonl 2026-11-21 13:03:43Z: both pids stopped, /health timed out).
[freeze.keep_running]
# (the lead's live test 2026-11-21 ~13:15Z: with only CodexBar's main pid stopped and CodexBarCLI running, /health answered 200 in 0.002 s and
# /usage in 0.18 s with live data, so the server does not need the UI process and CodexBar is first in the auto list.)
"com.steipete.codexbar" = ["Contents/Helpers/CodexBarCLI"]
# Chrome (Carried 116): the native-messaging hosts Chrome starts for extensions run from OUTSIDE its bundle, which made the whole app "host a build" (no
# actions). They are stdio bridges, not builds: left running (a stopped Chrome simply stops reading them). Absolute paths (`~` = home) are allowed for
# this. Chrome is NOT in the auto list: a click still freezes it, and the freeze has not been exercised live on it yet (docs/gui-hog-dialog.md O6).
"com.google.Chrome" = [
  "/Applications/1Password.app/Contents/Library/LoginItems/1Password Browser Helper.app/Contents/MacOS/1Password-BrowserSupport",
  "~/.local/share/chrome-use/ChromeUse.app/Contents/MacOS/chrome-use",
]
