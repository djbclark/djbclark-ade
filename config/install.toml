probe = "HTTP health on the configured proxy port (often :4000) or litellm --help in the fork venv"
platforms = ["mac", "linux"]
notes = "No install_argv until the operator names the fork remote and the apply unit for roles/litellm. Stock BerriAI/litellm is the documented upstream, not the auto-apply recipe."


