probe = "paseo --version"
probe_argv = ["paseo", "--version"]
presence = "paseo"
platforms = ["mac", "linux"]
notes = "CLI package @getpaseo/cli (npm bin paseo). Desktop/daemon and skill bundle (npx skills add getpaseo/paseo) are separate later units."

