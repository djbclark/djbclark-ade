install_argv = ["{bin}/ade-user-install", "cursor-cli", "--prefix", "{prefix}"]
update = "agent update"
update_argv = ["agent", "update"]
probe = "agent --version"
probe_argv = ["agent", "--version"]
presence = "agent"
platforms = ["mac", "linux"]
notes = "Official binary is agent (not cursor). Version pin is read from https://cursor.com/install; tarball fetched with urllib (no curl|bash, no shell=True). Non-dry-run needs ADE_USER_INSTALL_TRUST_VENDOR=1 (TLS-to-publisher; no forever digest — order 8). Login is a separate [[login]] check."

[[component]]
id = "skill-everywhere"
