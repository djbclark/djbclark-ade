[[component]]
id = "node"
class = "hard"
summary = "Node.js runtime (paired with hard npm; brew install node supplies both on Mac)"
source = "https://nodejs.org/"
install = "Mac: brew install node; Linux (Debian/Ubuntu apt): apt-get install -y nodejs npm"
