notes = "npm bin is codex. Monthly-plan login is a separate [[login]] check; distinct from OPENAI_API_KEY."

[[component]]
id = "cursor-cli"
class = "hard"
summary = "Cursor CLI / vendor client (agent binary)"
source = "https://cursor.com/docs/cli/installation"
install = "curl https://cursor.com/install -fsS | bash (official installer → ~/.local/bin/agent)"
update = "agent update"
update_argv = ["agent", "update"]
probe = "agent --version"
probe_argv = ["agent", "--version"]
presence = "agent"
platforms = ["mac", "linux"]
notes = "Official binary is agent (not cursor). install_argv left UNKNOWN: the published installer is a curl|bash pipe (no argv-list path yet; do not shell=True). Recorded update/probe only. Login is a separate [[login]] check."

[[component]]
id = "skill-everywhere"
class = "hard"
summary = "Link skills into every TUI from this repo"
source = "bin/skill-everywhere"
install = "symlink bin/skill-everywhere into ~/.local/bin, then skill-everywhere --all"
install_argv = ["{bin}/ade-user-install", "link", "skill-everywhere", "--root", "{root}", "--prefix", "{prefix}"]
update = "skill-everywhere --all"
update_argv = ["{prefix}/skill-everywhere", "--all"]
probe = "bash -n bin/skill-everywhere"
probe_argv = ["bash", "-n", "{bin}/skill-everywhere"]
presence = "skill-everywhere"
platforms = ["mac", "linux"]
notes = "Apply links the CLI; a follow-up --all sync is update_argv / later reconcile. Doctor syntax-checks the script (not --check --all)."

[[component]]
id = "firecrawl-router"
class = "offered"
chosen = true
summary = "bin/firecrawl-router toward a firecrawl endpoint"
source = "bin/firecrawl-router"
install = "symlink bin/firecrawl-router into ~/.local/bin"
install_argv = ["{bin}/ade-user-install", "link", "firecrawl-router", "--root", "{root}", "--prefix", "{prefix}"]
update = "repo pull (symlink target)"
probe = "firecrawl-router --help"
probe_argv = ["{bin}/firecrawl-router", "--help"]
presence = "firecrawl-router"
platforms = ["mac", "linux"]

