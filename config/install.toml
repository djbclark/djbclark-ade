update = "with node (package manager)"
probe = "npm --version"
probe_argv = ["npm", "--version"]
presence = "npm"
platforms = ["mac", "linux"]
notes = "Separate hard row so doctor/apply cannot treat node-without-npm as healthy. Linux system_argv matches node (apt nodejs+npm, re-land #389)."

[[component]]
id = "cursor-cli"
class = "hard"
summary = "Cursor CLI / vendor client (agent binary)"
source = "https://cursor.com/docs/cli/installation"
