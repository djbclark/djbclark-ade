install_argv = ["{bin}/ade-user-install", "link", "skill-everywhere", "--root", "{root}", "--prefix", "{prefix}"]
update = "skill-everywhere --all"
update_argv = ["{prefix}/skill-everywhere", "--all"]
probe = "bash -n bin/skill-everywhere"
probe_argv = ["bash", "-n", "{bin}/skill-everywhere"]
presence = "skill-everywhere"
platforms = ["mac", "linux"]
notes = "Apply links the CLI; a follow-up --all sync is update_argv / later reconcile. Doctor syntax-checks the script (not --check --all)."

