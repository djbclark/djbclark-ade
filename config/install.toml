probe = "PEER_LINK_TOOL or ~/src/peer-link/peer_mail.py check (via coding-bot status)"
platforms = ["mac", "linux"]
notes = "No install_argv: private source + order 11. Operator must grant clone access / confirm path before apply can record argv."

[[component]]
id = "litellm"
class = "offered"
chosen = true
summary = "LiteLLM proxy fork; Hermes fallback"
source = "https://github.com/BerriAI/litellm"
install = "operator fork at ~/src/litellm (site-djbclark roles/litellm); do not npm/pip install stock as the ADE fallback without that role"
