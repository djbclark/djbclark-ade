# Transitional install catalog (schema_version=1), 2026-11-09.
# Used when config/ade.toml is absent. Values are references and recipes, never secret values.
# install/update/probe = "UNKNOWN" means not yet recorded. presence = PATH basename fallback for doctor.
# install_argv / probe_argv = argv lists (tokens: {bin} {root} {home} {prefix}); doctor prefers probe_argv.
# needs_system = true means package-manager/root; bounded apply refuses without a later --system unit.
# chosen is required for offered/optional; hard components are always expected.

schema_version = 1

# --- hard ---

[[component]]
id = "just"
class = "hard"
summary = "Recipe runner; bootstrap installs it if missing"
source = "https://github.com/casey/just"
install = "ade-user-install just (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
update = "ade-user-install just (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
probe = "just --version"
probe_argv = ["just", "--version"]
presence = "just"
platforms = ["mac", "linux"]

[[component]]
id = "git"
class = "hard"
summary = "Source control"
install = "apt-get install -y git (Linux); brew install git (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "git"]
system_argv_darwin = ["brew", "install", "git"]
update = "package manager"
probe = "git --version"
probe_argv = ["git", "--version"]
presence = "git"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew. Preview with apply --system --dry-run or --print-system-argv; live needs --yes --system --apply-system."

[[component]]
id = "gh"
class = "hard"
summary = "GitHub CLI"
source = "https://cli.github.com"
install = "apt-get install -y gh (Linux); brew install gh (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "gh"]
system_argv_darwin = ["brew", "install", "gh"]
update = "package manager"
probe = "gh --version"
probe_argv = ["gh", "--version"]
presence = "gh"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew."

[[component]]
id = "uv"
class = "hard"
summary = "Python tool runner used by bin/pytest and install paths"
source = "https://github.com/astral-sh/uv"
install = "ade-user-install uv (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
update = "ade-user-install uv (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
probe = "uv --version"
probe_argv = ["uv", "--version"]
presence = "uv"
platforms = ["mac", "linux"]

[[component]]
id = "sudo-secretspec"
class = "hard"
summary = "Only way a key reaches a tool (review rule 3)"
source = "https://github.com/frdminc/sudo-secretspec"
install = "Mac: brew install frdminc/sudo-secretspec/sudo-secretspec. Linux x86_64: ade-user-install sudo-secretspec resolves releases/latest → versioned tarball + .sha256 → verify → extract media; opt-in sudo ./libexec/sudo-secretspec install --declarations PATH (packaging/README; Debian 12/13, Ubuntu 24.04+)"
needs_system = true
install_argv = ["{bin}/ade-user-install", "sudo-secretspec", "--prefix", "{prefix}"]
system_argv_darwin = ["brew", "install", "frdminc/sudo-secretspec/sudo-secretspec"]
update = "Mac: brew upgrade then interactive sudo-secretspec install from the new stage. Linux: ade-user-install sudo-secretspec again (re-fetch) then re-run libexec install from the new media (not from the installed client)"
update_argv = ["{bin}/ade-user-install", "sudo-secretspec", "--prefix", "{prefix}"]
probe = "sudo-secretspec doctor"
probe_argv = ["sudo-secretspec", "doctor"]
presence = "sudo-secretspec"
platforms = ["mac", "linux"]
notes = "Hard by operator ruling 2026-11-07. Package install ≠ privilege boundary: interactive `sudo-secretspec install --declarations` stays opt-in (`ade-user-install sudo-secretspec --declarations PATH --run-install`). Linux system_argv remains absent (2026-11-10): multi-step versioned asset — no single apt/brew argv and no pinned download URL; plan/apply fall through to install_argv on Linux when brew/system_argv is absent. Runtime apt deps only: sudo libsqlite3-0. Preview Mac brew with apply --system --dry-run."
