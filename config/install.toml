# Transitional install catalog (schema_version=1), 2026-11-09.
# Used when config/ade.toml is absent. Values are references and recipes, never secret values.
# install/update/probe = "UNKNOWN" means not yet recorded. presence = PATH basename fallback for doctor.
# install_argv / probe_argv = argv lists (tokens: {bin} {root} {home} {prefix}); doctor prefers probe_argv.
# needs_system = true means package-manager/root; bounded apply refuses without a later --system unit.
# chosen is required for offered/optional; hard components are always expected.

schema_version = 1

# --- hard ---

[[component]]
id = "just"
class = "hard"
summary = "Recipe runner; bootstrap installs it if missing"
source = "https://github.com/casey/just"
install = "ade-user-install just (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
update = "ade-user-install just (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "just", "--prefix", "{prefix}"]
probe = "just --version"
probe_argv = ["just", "--version"]
presence = "just"
platforms = ["mac", "linux"]

[[component]]
id = "git"
class = "hard"
summary = "Source control"
install = "apt-get install -y git (Linux); brew install git (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "git"]
system_argv_darwin = ["brew", "install", "git"]
update = "package manager"
probe = "git --version"
probe_argv = ["git", "--version"]
presence = "git"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew. Preview with apply --system --dry-run."

[[component]]
id = "gh"
class = "hard"
summary = "GitHub CLI"
source = "https://cli.github.com"
install = "apt-get install -y gh (Linux); brew install gh (Mac)"
needs_system = true
system_argv = ["apt-get", "install", "-y", "gh"]
system_argv_darwin = ["brew", "install", "gh"]
update = "package manager"
probe = "gh --version"
probe_argv = ["gh", "--version"]
presence = "gh"
platforms = ["mac", "linux"]
notes = "system_argv = Linux apt; system_argv_darwin = Homebrew."

[[component]]
id = "uv"
class = "hard"
summary = "Python tool runner used by bin/pytest and install paths"
source = "https://github.com/astral-sh/uv"
install = "ade-user-install uv (GitHub release → ~/.local/bin)"
install_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
update = "ade-user-install uv (re-fetch latest release)"
update_argv = ["{bin}/ade-user-install", "uv", "--prefix", "{prefix}"]
probe = "uv --version"
probe_argv = ["uv", "--version"]
presence = "uv"
platforms = ["mac", "linux"]

[[component]]
id = "sudo-secretspec"
class = "hard"
summary = "Only way a key reaches a tool (review rule 3)"
source = "https://github.com/frdminc/sudo-secretspec"
install = "brew install frdminc/sudo-secretspec/sudo-secretspec (Mac); Linux: release tarball installer (packaging/README)"
needs_system = true
system_argv_darwin = ["brew", "install", "frdminc/sudo-secretspec/sudo-secretspec"]
update = "brew upgrade (Mac) then interactive sudo-secretspec install; Linux tarball UNKNOWN for argv"
probe = "sudo-secretspec doctor"
probe_argv = ["sudo-secretspec", "doctor"]
presence = "sudo-secretspec"
platforms = ["mac", "linux"]
notes = "Hard by operator ruling 2026-11-07. Package install ≠ privilege boundary: interactive `sudo-secretspec install` is a later unit. Linux system_argv still UNKNOWN (tarball). Preview Mac brew with apply --system --dry-run."
[[component]]
id = "aiuse"
class = "hard"
summary = "Quota reading for routing"
source = "https://github.com/djbclark/aiuse"
install = "uv tool install git+https://github.com/djbclark/aiuse"
install_argv = ["uv", "tool", "install", "git+https://github.com/djbclark/aiuse"]
update = "uv tool upgrade aiuse"
update_argv = ["uv", "tool", "upgrade", "aiuse"]
probe = "aiuse --help"
probe_argv = ["aiuse", "--help"]
presence = "aiuse"
platforms = ["mac", "linux"]
notes = "Hard by operator ruling 2026-11-07; user-scoped via uv tool"

[[component]]
id = "cswap"
class = "hard"
summary = "claude-swap; aiuse reads it"
source = "https://pypi.org/project/claude-swap/"
install = "uv tool install claude-swap (→ ~/.local/bin/cswap)"
install_argv = ["uv", "tool", "install", "claude-swap"]
update = "uv tool upgrade claude-swap"
update_argv = ["uv", "tool", "upgrade", "claude-swap"]
probe = "cswap --help"
probe_argv = ["cswap", "--help"]
presence = "cswap"
platforms = ["mac", "linux"]
notes = "Hard dependency; vendor/README.md. PyPI package name is claude-swap; presence binary is cswap."

[[component]]
id = "paseo"
class = "hard"
summary = "Sole harness"
source = "https://github.com/getpaseo/paseo"
install = "npm install -g @getpaseo/cli (user npm prefix → ~/.local)"
install_argv = ["npm", "install", "-g", "@getpaseo/cli"]
update = "npm update -g @getpaseo/cli"
update_argv = ["npm", "update", "-g", "@getpaseo/cli"]
probe = "paseo --version"
probe_argv = ["paseo", "--version"]
presence = "paseo"
platforms = ["mac", "linux"]
notes = "CLI package @getpaseo/cli (npm bin paseo). Desktop/daemon and skill bundle (npx skills add getpaseo/paseo) are separate later units."

[[component]]
id = "graft"
class = "hard"
summary = "Repo context graph CLI"
source = "https://www.npmjs.com/package/@nanonets/graft"
install = "npm install -g @nanonets/graft (user npm prefix → ~/.local)"
install_argv = ["npm", "install", "-g", "@nanonets/graft"]
update = "npm update -g @nanonets/graft"
update_argv = ["npm", "update", "-g", "@nanonets/graft"]
probe = "graft --version"
probe_argv = ["graft", "--version"]
presence = "graft"
platforms = ["mac", "linux"]
notes = "Requires a writable npm prefix (e.g. ~/.local); not a root package-manager path"

[[component]]
id = "pi"
class = "hard"
summary = "Sole general-purpose third-party TUI"
source = "https://www.npmjs.com/package/@mariozechner/pi-coding-agent"
install = "npm install -g @mariozechner/pi-coding-agent (user npm prefix → ~/.local)"
install_argv = ["npm", "install", "-g", "@mariozechner/pi-coding-agent"]
update = "npm update -g @mariozechner/pi-coding-agent"
update_argv = ["npm", "update", "-g", "@mariozechner/pi-coding-agent"]
probe = "pi --version"
probe_argv = ["pi", "--version"]
presence = "pi"
platforms = ["mac", "linux"]
notes = "Pi policy 2026-11-08; archived omp/OpenCode/Crush are never reinstall targets. Provider packs via `pi install` are separate."

[[component]]
id = "claude-code"
class = "hard"
summary = "Vendor client for Claude monthly plan"
source = "https://www.npmjs.com/package/@anthropic-ai/claude-code"
install = "npm install -g @anthropic-ai/claude-code (user npm prefix → ~/.local)"
install_argv = ["npm", "install", "-g", "@anthropic-ai/claude-code"]
