platforms = ["mac", "linux"]

# --- offered (chosen recorded for this operator; new users are asked) ---

[[component]]
id = "hermes"
class = "offered"
chosen = true
summary = "Offered Hermes install and basic setup (S3a)"
source = "https://github.com/NousResearch/hermes-agent"
install = "ade-user-install hermes (downloads install.sh, runs bash install.sh --non-interactive)"
install_argv = ["{bin}/ade-user-install", "hermes"]
update = "hermes update"
update_argv = ["hermes", "update"]
probe = "hermes doctor"
probe_argv = ["hermes", "doctor"]
presence = "hermes"
platforms = ["mac", "linux"]
notes = "Avoids curl|bash by urllib-fetching install.sh then argv `bash <temp>/install.sh --non-interactive` (shell=False). Non-dry-run needs ADE_USER_INSTALL_TRUST_VENDOR=1 (same CDN trust as curl|bash; no forever digest — order 8). S3a basic setup is opt-in: `just hermes-setup` (prompts/setup/hermes.md) or `just hermes-setup --self` (DIY checklist); does not force Hermes or configure peer-link live. peer-link and LiteLLM fork stay separate components."

[[component]]
id = "peer-link"
class = "offered"
chosen = true
summary = "Grok Bot channel (frdminc/peer-link)"
