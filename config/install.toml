# --- install.jobs (S4b inventory, 2026-11-10) ---
# Transitional home of setup-plan [install.jobs] while config/ade.toml is absent.
# owner=djbclark-ade: ADE may reconcile later. Other owners: doctor reports only; never unload.
# kind=ade-sched → plist via bin/ade-sched (launchd/systemd/cron by backend). kind=paseo → paseo schedule.
# kind=service → dependency/site service; observe only.

[[install.jobs]]
name = "load-watch"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.load-watch"
plist = "launchd/com.djbclark.load-watch.plist"
schedule = "StartInterval 20"
command = "bin/load-watch sample"
platforms = ["mac", "linux"]
notes = "Historically installed by load-watch install; inventory records ADE ownership (S4b)."

[[install.jobs]]
name = "deadline-sweep"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.deadline-sweep"
plist = "config/launchd/com.djbclark.deadline-sweep.plist"
schedule = "StartInterval 60"
command = "bin/deadline sweep"
set = ["__STATE__={home}/.local/state/deadlines"]
platforms = ["mac", "linux"]

[[install.jobs]]
name = "pr-policy"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.pr-policy"
plist = "config/launchd/com.djbclark.pr-policy.plist"
schedule = "StartCalendarInterval (see plist)"
command = "bin/pr-policy"
set = ["__STATE__={home}/.local/state/pr-policy"]
platforms = ["mac", "linux"]

[[install.jobs]]
name = "ade-update-check"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.ade-update-check"
plist = "config/launchd/com.djbclark.ade-update-check.plist"
schedule = "StartInterval 86400"
command = "bin/ade-update --check"
set = ["__STATE__={home}/.local/state/ade"]
platforms = ["mac", "linux"]
notes = "Daily check only; never auto-applies (S4 / PR 359)."

[[install.jobs]]
name = "update-auto"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
schedule = "daily (plist pending)"
command = "just update --auto"
platforms = ["mac", "linux"]
notes = "S4 daily auto-update; plist/install path not yet recorded (planned)."

[[install.jobs]]
name = "harden-check"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.harden-check"
plist = "config/launchd/com.djbclark.harden-check.plist"
schedule = "StartInterval 86400"
command = "bin/ade-harden observe"
set = ["__STATE__={home}/.local/state/ade"]
platforms = ["mac", "linux"]
notes = "S6 daily read-only drift check; never mutates GitHub settings (observe only)."

[[install.jobs]]
name = "keys-check"
kind = "ade-sched"
owner = "djbclark-ade"
class = "hard"
label = "com.djbclark.keys-check"
plist = "config/launchd/com.djbclark.keys-check.plist"
schedule = "StartInterval 86400"
command = "bin/ade-install keys"
set = ["__STATE__={home}/.local/state/ade"]
platforms = ["mac", "linux"]
notes = "S3b daily keys observe; never prompts or prints secret values (ade-install keys)."

[[install.jobs]]
name = "context-budget"
kind = "paseo"
owner = "djbclark-ade"
class = "hard"
label = "context-budget"
schedule = "50 3 * * *"
mode = "auto"
command = "bin/context-budget-check --instruction-lint (Paseo schedule; see docs/scheduling.md)"
platforms = ["mac", "linux"]
notes = "C69; explicit --mode auto required on create."

[[install.jobs]]
name = "routing-recalibrate"
kind = "paseo"
owner = "djbclark-ade"
class = "optional"
chosen = false
label = "routing-recalibrate"
schedule = "0 9 1 * *"
mode = "auto"
command = "bin/route_agent.py calibrate --json --since 30; re-rank good_at only when suggestions (see docs/scheduling.md)"
platforms = ["mac", "linux"]
notes = "Carried #33 / E5: monthly Day-1 09:00 judgment schedule; doctor quiet until chosen; create line in docs/scheduling.md."

[[install.jobs]]
name = "paseo-upstream-pending"
kind = "paseo"
owner = "djbclark-ade"
class = "optional"
chosen = false
label = "paseo-upstream-pending"
schedule = "0 */4 * * *"
mode = "auto"
command = "Read fleet-watch upstream-paseo.json; report only (C70)"
platforms = ["mac", "linux"]
notes = "Optional operator schedule; doctor quiet when unchosen."

[[install.jobs]]
name = "paseo-daemon"
kind = "service"
owner = "dependency"
class = "hard"
label = "paseo"
command = "paseo daemon (dependency installer)"
platforms = ["mac", "linux"]
notes = "Installed by Paseo's own path; doctor observes, ADE never reimplements."

[[install.jobs]]
name = "herdr-server"
kind = "service"
owner = "dependency"
class = "optional"
chosen = false
label = "dev.herdr.server"
plist = "config/launchd/dev.herdr.server.plist"
command = "herdr server (if still running)"
platforms = ["mac"]
notes = "AGENTS.md: never touch herdr config; inventory records so doctor reports without unloading."

