probe = "claude --version"
probe_argv = ["claude", "--version"]
presence = "claude"
platforms = ["mac", "linux"]
notes = "npm bin is claude. Account login is a separate [[login]] check, not an API key."

[[component]]
id = "codex"
class = "hard"
summary = "Vendor client for Codex monthly plan (not OpenAI API credits)"
source = "https://www.npmjs.com/package/@openai/codex"
install = "npm install -g @openai/codex (user npm prefix → ~/.local)"
install_argv = ["npm", "install", "-g", "@openai/codex"]
