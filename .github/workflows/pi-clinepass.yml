name: Pi manual providers
on:
  push:
    branches: [emergency-clinepass-pi]
  pull_request:
    paths: ['pi-extensions/clinepass/**', 'pi-extensions/venice/**', 'pi-extensions/rfab/**', 'bin/ade*mcp*rfab*', 'config/mcp-on-demand.toml', 'tests/test_pi_clinepass.py', 'tests/test_pi_venice_rfab.py', '.github/workflows/pi-clinepass.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install current Pi
        run: npm install -g @earendil-works/pi-coding-agent@latest
      - name: Provider registration, credential failures and routing reservation
        run: uv run --with pytest python -m pytest tests/test_pi_clinepass.py tests/test_pi_venice_rfab.py tests/test_pi_defaults.py -q
