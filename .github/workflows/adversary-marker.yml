name: Adversary marker

# The merge gate for AGENTS.md review rule 1 (slim-down E8, 2026-11-06; docs/review-boundary.md).
# It reads the `<!-- adversary-verdict:v1 {...} -->` marker from the PR body and the PR's issue comments through
# the API and posts the commit status `adversary-marker` on the PR head: success only for a live APPROVE naming
# that head, from a trusted place (below), on every open PR at that head.
#
# Why these triggers (Wave 4 research, 2026-11-06): `pull_request_target` is blocked by default in public
# repositories from 2026-12-02, and a `pull_request` workflow is read from the PR's own merge ref, so a PR
# could replace this file. `workflow_run` and `workflow_dispatch` run this file and the checked-out module
# from the DEFAULT branch; nothing from the PR is checked out or run. The `merge-gate` environment allows
# deployments from `master` only, so its App key is unreachable from any `pull_request` run, and the ruleset
# pins the required check to the App's integration id, so a status posted by any other workflow (a PR may
# add one with `permissions: {statuses: write}`) does not count. A PR that edits or deletes the Tests
# workflow gets no `adversary-marker` status at all, which fails closed (the check is required).
#
# Everything a PR carries (body, title, commits, branch name, comments, check output) is untrusted data
# (operator, 2026-11-07): nothing from it is checked out, executed or interpolated. An APPROVE counts only
# in the body of a PR the repository owner wrote whose last editor is the owner or a login in
# BODY_TRUSTED_EDITOR_LOGINS (`cursor`, 2026-11-09); any other PR (MEMBER and COLLABORATOR
# authors included) is approved only by the owner's own issue comment carrying the marker (not one posted via
# a GitHub App). A listed App editing an outside body cannot approve it. A BLOCK naming the head counts in
# the body or any comment, whoever wrote it.
#
# Owner-authored PRs need no marker paste (owner-trust, 2026-11-10). A body/comment edit on an outside PR is
# not a Tests run: re-check with `gh workflow run adversary-marker.yml -f pr=N`. A push of this workflow or
# `bin/adversary_marker.py` to the default branch rejudges every open PR (one marker job per head, same
# concurrency group as dispatch / workflow_run for that sha), so landing owner-trust flips owner tips green
# without per-PR dispatch.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-check (after the marker was written or edited)
        required: true
        type: string
  push:
    paths:
      - "bin/adversary_marker.py"
      - ".github/workflows/adversary-marker.yml"

permissions: {}

jobs:
  # Job 1 finds the PR(s) and emits a strategy.matrix with one cell per head (push: every open same-repo PR
  # grouped by head; workflow_run / dispatch: the event's PRs plus every other open PR at that head). No secret,
  # no environment. Belt and braces beside the environment's branch policy: a dispatch/push from any other ref
  # does nothing.
  resolve:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      has_work: ${{ steps.find.outputs.has_work }}
    steps:
      - name: Check out the default branch (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the PR
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I bin/adversary_marker.py --resolve --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --repo "$GITHUB_REPOSITORY"

  # One job per head. Concurrency group is always the head sha, so a push sweep never races a dispatch or
  # Tests completion that posts on the same commit (2026-11-10).
  marker:
    needs: resolve
    if: ${{ needs.resolve.outputs.has_work == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    concurrency:
      group: adversary-marker-${{ matrix.head }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: merge-gate
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check out the default branch (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the ade-merge-gate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_GATE_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
          permission-statuses: write
          permission-checks: write

      - name: Judge the marker and post the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app-token.outputs.token }}
          PRS: ${{ matrix.prs }}
          AT_HEAD: ${{ matrix.head }}
          # MARKER_POST_AS: check-run   # the fallback if an App status does not satisfy the ruleset (docs/review-boundary.md)
        run: python3 -I bin/adversary_marker.py --prs "$PRS" --at-head "$AT_HEAD" --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --repo "$GITHUB_REPOSITORY"
