name: Fork Journal transactions
on:
  push:
    branches: [fork-maintenance-journal]
  pull_request:
    paths:
      - 'bin/ade_fork_release.py'
      - 'tests/test_ade_fork_release.py'
      - 'docs/fork-release.md'
      - '.github/workflows/fork-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-journal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Synthetic Journal crash and authority matrix (not native acceptance)
        run: uv run --with pytest python -m pytest tests/test_ade_fork_release.py tests/test_ade_fork_ci.py tests/test_ade_forks.py --junitxml=journal-unit.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-journal-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: journal-unit.xml
          if-no-files-found: error
