name: Linux CI

# Overlay-only on ci/base. Runs djbclark-ade's pytest suite on ubuntu-latest.
# Mac-only tests (launchd, Keychain, this Mac's state) are skipped here only
# through DJBCLARK_ADE_CI=1 / the --deselect list below, never by editing tests.

on:
  push:
    branches: ['ci/run/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DJBCLARK_ADE_CI: "1"
  # conftest.py also sets these; exported so subprocesses of tests see them too.
  ACP_DISPATCH_LAUNCHCTL: /usr/bin/true
  ACP_DISPATCH_NO_GATE: "1"

jobs:
  pytest:
    name: pytest (tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: GNU tool aliases (the Mac code calls gsed, gdate, ghead, ...; Linux's own tools are the GNU ones)
        run: |
          for t in sed grep awk date stat tr wc head tail seq id sort cp tee readlink realpath du split cut touch mktemp ls find; do
            p=$(command -v "$t") && sudo ln -sf "$p" "/usr/local/bin/g$t"
          done
          sudo ln -sf "$(command -v timeout)" /usr/local/bin/gtimeout
      - name: Git identity (tests make commits)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch master
      - name: DEBUG
        run: |
          env | sort | grep -E "XDG|HOME|OPENCODE|PATH" || true
          uv run --no-project --with pytest python -m pytest -q -vv -p no:cacheprovider tests/test_acp_run_strip.py -k opencode_deny_gets 2>&1 | tail -60
