name: Fork controller
on:
  push:
    branches: [fork-maintenance-controller]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: djbclark/paseo
          ref: 389bb84ea48c8c800a3c528b23e1d192be052959
          path: native-readonly-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --with pytest python -m pytest tests/test_ade_fork_controller.py tests/test_ade_fork_release.py tests/test_ade_fork_ci.py -q
        env:
          ADE_CI_REQUIRE_NATIVE_READONLY_SOURCE: "1"
