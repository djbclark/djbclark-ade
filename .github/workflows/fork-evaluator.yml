name: Fork evaluator
on:
  push:
    branches: [fork-maintenance-evaluator]
  pull_request:
    paths:
      - 'bin/ade_fork_evaluator.py'
      - 'bin/ade-fork-evaluate'
      - 'tests/test_ade_fork_evaluator.py'
      - 'docs/fork-evaluator.md'
      - '.github/workflows/fork-evaluator.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact candidate commit (empty runs unit evidence only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fork-evaluator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluator-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Synthetic runtime fixtures and real snapshot/archive/JUnit tests
        run: uv run --with pytest python -m pytest -q tests/test_ade_fork_evaluator.py tests/test_ade_fork_release.py tests/test_ade_fork_controller.py --junitxml=evaluator-unit-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluator-unit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluator-unit-junit.xml
          if-no-files-found: error
  protected-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: evaluator
          persist-credentials: false
      - name: Validate bounded candidate object before checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}|[0-9a-f]{64}",os.environ["SOURCE_SHA"])'
      - uses: actions/checkout@v7
        with:
          repository: djbclark/djbclark-ade
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      # Root integration supplies the reviewed recipe, sealed native distribution
      # and genuine coupled harness. Missing any => HOLD, never upload.
      - name: Protected source/compiler/runtime assessment
        id: assessment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 evaluator/bin/ade-fork-evaluate --source-sha "$SOURCE_SHA" > producer-result.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          row = json.loads(Path('producer-result.json').read_text())
          assert row['status'] == 'emitted'
          assert re.fullmatch(r'ade-yolo-qualified-[a-f0-9]{40,64}-[0-9]+-[0-9]+', row['artifact_name'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_name=' + row['artifact_name'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.assessment.outcome == 'success'
        with:
          name: ${{ steps.assessment.outputs.artifact_name }}
          path: |
            qualified-output/receipt.json
            qualified-output/snapshot.json
            qualified-output/evaluator-evidence.json
          if-no-files-found: error
