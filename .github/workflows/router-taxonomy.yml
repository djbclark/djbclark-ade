name: Router quota taxonomy
on:
  push:
    paths: ['bin/route_agent.py', 'tests/test_route_agent*.py', '.github/workflows/router-taxonomy.yml']
  pull_request:
    paths: ['bin/route_agent.py', 'tests/test_route_agent*.py', '.github/workflows/router-taxonomy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Verify routing and pool isolation contracts
        run: timeout 600 uv run --with pytest python -m pytest tests/test_route_agent*.py -q
