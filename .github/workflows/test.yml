name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      context_only:
        description: Run only the focused context and Go cost checks
        type: boolean
        default: false
      macos:
        description: Also run the suite on the macOS runner (off by default; on request only; ignored when context_only is set)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pytest:
    # On request only (operator, 2026-10-29: "Nothing needs to use macos unless specifically
    # requested"): a manual dispatch with the `macos` input. Pull requests and pushes run the
    # Linux leg, so a slow macOS runner queue never blocks a merge.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.macos == 'true' && github.event.inputs.context_only != 'true' }}
    runs-on: macos-latest
    # 45, not 30: the macOS runner is the slow leg. Four consecutive green runs measured 1446 s,
    # 1588 s, 1615 s and 1702 s against a 1800 s cap, and on 2026-10-27 the suite crossed it —
    # run 40533487414 was cancelled with "The job has exceeded the maximum execution time of
    # 30m0s" while pytest-linux passed in 17m0s and context-policy in 14 s. The cap has to sit
    # above the suite's real cost plus drift, or a slow runner reports a wall-clock timeout as a
    # code failure. pytest-linux was 30 (1130-1150 s measured) until 2026-11-02: its suite then measured 1775 s and
    # run 41519917412 (PR 257) was cancelled at 98% with zero failures, so it has 45 as well.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      # The repo's scripts and the tests' fake agents call the g-prefixed GNU tools
      # (gwc, ghead, gdate, ggrep, gsed, gawk, ...); the runner has the BSD ones only.
      - name: Install the GNU tools
        run: brew install coreutils findutils gnu-sed grep gawk

      - name: Run the test suite
        run: uv run --with pytest --with pyyaml --with 'agent-client-protocol>=0.9,<1.0' python -m pytest tests/ -q

  pytest-linux:
    if: ${{ github.event.inputs.context_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # fetch-depth 0 so we can diff against the PR base / push before SHA for the
      # docs/changelog short-circuit (2026-11-09: suite itself is ~10–11 min; setup ~5 s).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep the job name pytest-linux always green on docs/changelog-only changes so
      # required checks stay satisfied without a ruleset edit. context-policy still runs.
      # Allowlist: CHANGELOG.md, changelog.d/**, docs/** — see docs/ci-notes.md.
      - name: Decide whether the full suite is required
        id: suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          chmod +x .github/scripts/pytest-suite-needed.sh
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ]; then
            echo "suite=needed reason=no-base" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          out=$(.github/scripts/pytest-suite-needed.sh --base "$base" --head "$HEAD_SHA")
          rc=$?
          set -e
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 1 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pytest-suite-needed.sh failed rc=$rc" >&2
            exit "$rc"
          fi

      - name: Set up uv
        if: steps.suite.outputs.needed == 'true'
        uses: astral-sh/setup-uv@v10.3.2

      # On Linux the tools exist under their plain names (GNU sed, grep, find and gawk; on
      # ubuntu-26.04 the coreutils are Rust uutils, not GNU), but the repo's scripts
      # and the tests' fake agents call the g-prefixed names the Mac needs. Make one
      # g-prefixed wrapper script per tool that exists, in a directory put on PATH. A wrapper,
      # not a symlink: ubuntu-26.04's coreutils are Rust uutils multicall binaries that refuse
      # to run under another name ("Requested utility `gtr` does not match executable name").
      - name: Create the g-prefixed GNU tool wrappers
        if: steps.suite.outputs.needed == 'true'
        run: |
          set -eu
          # Ubuntu's default awk is mawk; the scripts want real GNU awk.
          if ! command -v gawk >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gawk
          fi
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          for tool in sed grep head wc date awk find xargs mktemp stat realpath timeout tail cut sort tr; do
            target="$(command -v "$tool" 2>/dev/null || true)"
            if [ -z "$target" ]; then
              echo "skip g$tool: no $tool on PATH"
              continue
            fi
            if [ "$tool" = awk ] && command -v gawk >/dev/null 2>&1; then
              continue  # gawk is already a real GNU awk under its own name
            fi
            # The path is written unquoted into the wrapper: refuse anything a shell would split or expand,
            # including a non-absolute result (a relative PATH entry, a function or a builtin).
            case "$target" in
              [!/]*|*[!A-Za-z0-9/._+-]*) echo "refusing $tool target that is not a plain absolute path: $target" >&2; exit 1 ;;
            esac
            printf '#!/bin/sh\nexec %s "$@"\n' "$target" > "$bindir/g$tool"
            chmod +x "$bindir/g$tool"
            echo "g$tool -> $target"
          done
          echo "$bindir" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v6
        if: steps.suite.outputs.needed == 'true'
        with:
          node-version: 24

      - name: Run the test suite
        if: steps.suite.outputs.needed == 'true'
        run: uv run --with pytest --with pyyaml --with 'agent-client-protocol>=0.9,<1.0' python -m pytest tests/ -q

      - name: Skipped full suite (docs/changelog-only)
        if: steps.suite.outputs.needed != 'true'
        run: |
          echo "pytest-linux short-circuit: docs/changelog-only diff; context-policy still ran."

  context-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Go policy, native compaction and Claude nudges
        run: >-
          uv run --with pytest --with pyyaml --with 'agent-client-protocol>=0.9,<1.0'
          python -m pytest tests/test_go_model_policy.py tests/test_go_context_plugin.py
          claude/hooks/handoff-tools/tests/test_context_size_nudge.py
          tests/test_instruction_lint.py -q
      - name: Instruction-file lint (errors block, warnings report)
        run: uv run python bin/instruction-lint --root .
      - name: README roster matches skills/ and bin/ (bin/ade-roster, 2026-11-07)
        run: python3 bin/ade-roster --check
      # Fold mirrors: config/ade.toml must match legacy secret-deny / pr-policy / install
      # (and the other policy domains) while both the unified file and the split TOMLs are kept.
      - name: config/ade.toml matches fold from legacy mirrors (ade-config fold --check)
        run: python3 bin/ade-config fold --check
