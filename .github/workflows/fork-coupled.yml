name: Fork coupled acceptance
on:
  push:
    branches: [fork-maintenance-coupled]
  pull_request:
    paths:
      - 'tests/fixtures/fork-coupled/**'
      - '.github/workflows/fork-coupled.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-coupled-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Shared ADE helper decisions, no namespace qualification
        run: uv run --with pytest python -m pytest tests/test_ade_directory_helper_decisions.py tests/test_ade_ws_autoname.py tests/test_ade_ws_names.py tests/test_ade_claims_bind_owner.py tests/test_ade_claims_release.py -q
      - name: Descriptor and owned-process teardown tests, not runtime qualification
        run: |
          node --check tests/fixtures/fork-coupled/native-roundtrip.mjs
          node --check tests/fixtures/fork-coupled/native-agent-metadata.mjs
          node --test tests/fixtures/fork-coupled/retained-daemon.test.mjs tests/fixtures/fork-coupled/compiler-observation.test.mjs tests/fixtures/fork-coupled/retained-cli.test.mjs
      - name: Archive boundary tests, synthetic bytes only
        run: python3 -m unittest discover -s tests/fixtures/fork-coupled -p test_native_build.py -v
      # The actual retained daemon/evaluator/controller round trip requires the
      # completed authenticated native build plus protected recipe and cohort.
      # This job emits no qualified artifact or promotion approval.
  completed-build-input:
    # Retained system bytes are bound only inside a private disposable namespace.
    # The reviewed existing-layout adapter refuses incompatible host layouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate completed producer run and every archived byte; execute nothing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/fixtures/fork-coupled/acquire-native-build.py "$RUNNER_TEMP/native-build-input"
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Actual disposable daemon registrations and missing-profile refusal; not qualification
        run: node tests/fixtures/fork-coupled/registration-smoke.mjs "$RUNNER_TEMP/native-build-input"
      # The reviewed expectation is a build-only input. It is not a qualified
      # snapshot, runtime result, promotion grant or approval of this workflow.
