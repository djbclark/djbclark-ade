name: NATS runtime distribution
on:
  push:
    branches: ['feat/nats-*', 'master']
    paths:
      - 'lib/ade-coord/**'
      - 'bin/ade_coord*.py'
      - 'bin/ade-coord*'
      - 'bin/ade-nats-cli'
      - 'bin/ade-nats-credential'
      - 'tests/test_nats_credential.py'
      - 'bin/ade_claims.py'
      - 'bin/ade_self_session.py'
      - 'bin/ade_send_guard.py'
      - 'bin/ade_lead_succession.py'
      - 'bin/completion-notice'
      - 'plugins/ade-coord/**'
      - '.github/workflows/nats-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Resolve portable runtime dependencies in CI
        working-directory: lib/ade-coord
        run: |
          timeout 180 npm install --omit=dev --ignore-scripts
          npm ls --all
      - name: Verify atomic runtime credential consumer
        run: python3 -m unittest discover -s tests -p test_nats_credential.py -v
      - name: Download native CLI distributions and verify release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 180 gh release download --repo nats-io/natscli --pattern 'nats-*-darwin-arm64.zip' --pattern 'nats-*-darwin-amd64.zip' --pattern 'nats-*-linux-amd64.zip' --pattern 'nats-*-linux-arm64.zip' --pattern SHA256SUMS --dir "$RUNNER_TEMP/native-nats"
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-nats'
          expected = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              expected[name.lstrip('*')] = digest
          for archive in root.glob('*.zip'):
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected[archive.name]
              platform = next(p for p in ['darwin-arm64', 'darwin-amd64', 'linux-amd64', 'linux-arm64'] if archive.name.endswith(p + '.zip'))
              target = pathlib.Path('vendor/natscli') / platform
              target.mkdir(parents=True)
              with zipfile.ZipFile(archive) as source:
                  binary, = [n for n in source.namelist() if n.endswith('/nats') or n == 'nats']
                  (target / 'nats').write_bytes(source.read(binary))
                  (target / 'nats').chmod(0o755)
                  for name in source.namelist():
                      if pathlib.PurePosixPath(name).name.lower().startswith(('license', 'notice')):
                          (target / pathlib.PurePosixPath(name).name).write_bytes(source.read(name))
          PYCODE
      - name: Package exact public source and dependency provenance
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess, datetime
          for required in ['bin/ade-coord', 'plugins/ade-coord', 'lib/ade-coord/cli.js', 'bin/ade_coord_resources.py']:
              assert pathlib.Path(required).exists(), 'adapters must be integrated before distributing runtime'
          data = {'schema': 1, 'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'created': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'dependency_lock_sha256': hashlib.sha256(pathlib.Path('lib/ade-coord/package-lock.json').read_bytes()).hexdigest(),
                  'node_version': subprocess.check_output(['node', '--version'], text=True).strip(),
                  'authority': 'distribution only; never ownership or enrollment evidence'}
          pathlib.Path('ade-runtime-build.json').write_text(json.dumps(data, sort_keys=True))
          PYCODE
          tar --exclude='__pycache__' --exclude='*.pyc' -czf "$RUNNER_TEMP/ade-coord-runtime.tar.gz" bin config lib/ade-coord libexec/agent-bin plugins/ade-coord vendor/natscli ade-runtime-build.json
          python3 - <<'PYCODE'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with (root / 'ade-coord-runtime.tar.gz').open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          (root / 'ade-coord-runtime.sha256').write_text(digest + '  ade-coord-runtime.tar.gz\n')
          PYCODE
      - name: Verify extracted artifact layout without a package install
        run: |
          mkdir "$RUNNER_TEMP/ade-runtime-extracted"
          tar -xzf "$RUNNER_TEMP/ade-coord-runtime.tar.gz" -C "$RUNNER_TEMP/ade-runtime-extracted"
          echo '{}' | node "$RUNNER_TEMP/ade-runtime-extracted/lib/ade-coord/cli.js" outbox status --state-dir "$RUNNER_TEMP/runtime-offline-state"
          python3 "$RUNNER_TEMP/ade-runtime-extracted/bin/ade-nats-cli" --version
          python3 -m compileall -q "$RUNNER_TEMP/ade-runtime-extracted/bin"
      - name: Verify the actual installer and atomic pointer
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          digest = (root / 'ade-coord-runtime.sha256').read_text().split()[0]
          destination = root / 'runtime-install'
          argv = ['python3', 'bin/ade-coord-install', str(root / 'ade-coord-runtime.tar.gz'), '--sha256', digest, '--root', str(destination)]
          result = subprocess.run(argv, capture_output=True, text=True, check=True)
          assert json.loads(result.stdout)['result']['roles_enrolled'] is False
          before = (destination / 'current').readlink()
          bad = argv.copy()
          bad[bad.index('--sha256') + 1] = '0' * 64
          assert subprocess.run(bad, capture_output=True).returncode == 1
          assert (destination / 'current').readlink() == before
          PYCODE
      - uses: actions/upload-artifact@v6
        with:
          name: ade-coord-runtime
          path: |
            ${{ runner.temp }}/ade-coord-runtime.tar.gz
            ${{ runner.temp }}/ade-coord-runtime.sha256
          retention-days: 14
