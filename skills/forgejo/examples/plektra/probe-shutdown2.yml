name: runner probe (shutdown with a blocked reader)
on:
  push:
    branches: ['probe/**']
jobs:
  shutdown2:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Install JDK 17 and gcc
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless gcc libc6-dev > /dev/null
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "gcc rc=$?"
      - name: Client socket closed while another thread is blocked in read(), without and with the shim
        run: |
          set +e
          cp Sd3.java /tmp/Sd3.java
          timeout -s KILL 30 java /tmp/Sd3.java 31360; rc=$?
          [ $rc = 137 ] && echo "RESULT no shim: HUNG (killed after 30 s)" || echo "RESULT no shim: rc=$rc"
          LD_PRELOAD=/tmp/portshim.so timeout -s KILL 30 java /tmp/Sd3.java 31361; rc=$?
          [ $rc = 137 ] && echo "RESULT with shim: HUNG (killed after 30 s)" || echo "RESULT with shim: rc=$rc"
          exit 0
