name: runner probe (shutdown on listener)
on:
  push:
    branches: ['probe/**']
jobs:
  shutdown:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Install JDK 17
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless
      - name: shutdown(2) on loopback listeners (fixed ports, so no shim is needed)
        run: |
          set +e
          cat > /tmp/sd.py <<'PY'
          import socket, sys, threading, time
          case = sys.argv[1]; port = int(sys.argv[2])
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", port)); s.listen(5)
          if case in ("accept_blocked", "accepted_client"):
              threading.Thread(target=lambda: s.accept(), daemon=True).start(); time.sleep(0.3)
          if case == "accepted_client":
              c = socket.create_connection(("127.0.0.1", port), timeout=5); time.sleep(0.3)
          t = time.time(); s.shutdown(socket.SHUT_RDWR); print(case, "shutdown returned after %.2fs" % (time.time() - t))
          s.close(); print(case, "close returned")
          PY
          i=0
          for c in bare accept_blocked accepted_client; do
            i=$((i+1)); timeout 20 python3 /tmp/sd.py $c $((31330+i)); rc=$?
            [ $rc = 124 ] && echo "RESULT $c: HUNG (timeout 20 s)" || echo "RESULT $c: rc=$rc"
          done
          cat > /tmp/Sd.java <<'JAVA'
          import java.net.*;
          public class Sd { public static void main(String[] a) throws Exception {
            ServerSocket s = new ServerSocket(31340);
            Thread t = new Thread(() -> { try { s.accept(); } catch (Exception e) { System.out.println("accept ended: " + e); } });
            t.start(); Thread.sleep(300);
            long t0 = System.nanoTime(); s.close(); System.out.println("java ServerSocket.close returned after " + (System.nanoTime() - t0) / 1000000 + " ms"); } }
          JAVA
          timeout 30 java /tmp/Sd.java; rc=$?
          [ $rc = 124 ] && echo "RESULT java ServerSocket.close with a blocked accept: HUNG (timeout 30 s)" || echo "RESULT java: rc=$rc"
          cat > /tmp/Sd2.java <<'JAVA'
          import java.net.*;
          public class Sd2 { public static void main(String[] a) throws Exception {
            ServerSocket s = new ServerSocket(31341);
            Thread t = new Thread(() -> { try { Socket c = s.accept(); Thread.sleep(500); c.close(); } catch (Exception e) { System.out.println("accept ended: " + e); } });
            t.start(); Socket cl = new Socket("127.0.0.1", 31341); Thread.sleep(200);
            long t0 = System.nanoTime(); s.close(); System.out.println("java ServerSocket.close (after an accepted connection) returned after " + (System.nanoTime() - t0) / 1000000 + " ms"); cl.close(); } }
          JAVA
          timeout 30 java /tmp/Sd2.java; rc=$?
          [ $rc = 124 ] && echo "RESULT java ServerSocket.close after an accepted connection: HUNG (timeout 30 s)" || echo "RESULT java2: rc=$rc"
          exit 0
      - name: Same Java cases with the shim's listener-aware shutdown() override
        run: |
          set +e
          apt-get install -y -qq gcc libc6-dev > /dev/null
          gcc -shared -fPIC -O2 -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "gcc rc=$?"
          sed -i 's/31340/31350/; s/31341/31351/g' /tmp/Sd.java /tmp/Sd2.java
          for c in Sd Sd2; do
            LD_PRELOAD=/tmp/portshim.so timeout -s KILL 30 java /tmp/$c.java; rc=$?
            [ $rc = 137 ] && echo "RESULT shim $c: HUNG (killed after 30 s)" || echo "RESULT shim $c: rc=$rc"
          done
          exit 0
