name: runner probe (shim on each image label)
on:
  push:
    branches: ['probe/**']
jobs:
  ubuntu:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Build the shim and probes, run them with and without it
        shell: sh
        run: |
          set +e
          apt-get update -qq; apt-get install -y -qq gcc libc6-dev > /dev/null; echo "install rc=$?"
          uname -r; (ldd --version 2>&1 | head -1)
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "shim build rc=$?"
          gcc -O2 -pthread -o /tmp/duplex duplex-probe.c; echo "duplex build rc=$?"
          gcc -O2 -pthread -o /tmp/rp reuse-probe.c 2>/dev/null; echo "reuse build rc=$?"
          cat > /tmp/p0.py <<'PY'
          import socket, threading, time
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(5); port = s.getsockname()[1]
          threading.Thread(target=lambda: s.accept(), daemon=True).start(); time.sleep(0.2)
          try: socket.create_connection(("127.0.0.1", port), timeout=3); print("port-0 listener reachable, port", port)
          except Exception as e: print("port-0 listener UNREACHABLE", port, e)
          PY
          echo "--- port 0 without shim"; python3 /tmp/p0.py
          echo "--- port 0 with shim"; LD_PRELOAD=/tmp/portshim.so python3 /tmp/p0.py
          echo "--- duplex-probe WITHOUT shim (expect stalls)"; timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv|\.\.\.after'
          echo "--- duplex-probe WITH shim (expect ~1 ms)";    LD_PRELOAD=/tmp/portshim.so timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv'
          echo "--- reuse-probe WITH shim, 20 rounds, gap 0";  LD_PRELOAD=/tmp/portshim.so REUSE_PORT=31980 timeout -s KILL 100 /tmp/rp 20 0 jdk
          echo "--- reuse-probe WITHOUT shim, 10 rounds, gap 0 (expect failures)"; REUSE_PORT=31981 timeout -s KILL 100 /tmp/rp 10 0 jdk
          exit 0
  alpine:
    runs-on: alpine
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Build the shim and probes, run them with and without it
        shell: sh
        run: |
          set +e
          apk add --no-cache build-base > /dev/null; echo "install rc=$?"
          uname -r; (ldd --version 2>&1 | head -1)
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "shim build rc=$?"
          gcc -O2 -pthread -o /tmp/duplex duplex-probe.c; echo "duplex build rc=$?"
          gcc -O2 -pthread -o /tmp/rp reuse-probe.c 2>/dev/null; echo "reuse build rc=$?"
          cat > /tmp/p0.py <<'PY'
          import socket, threading, time
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(5); port = s.getsockname()[1]
          threading.Thread(target=lambda: s.accept(), daemon=True).start(); time.sleep(0.2)
          try: socket.create_connection(("127.0.0.1", port), timeout=3); print("port-0 listener reachable, port", port)
          except Exception as e: print("port-0 listener UNREACHABLE", port, e)
          PY
          echo "--- port 0 without shim"; python3 /tmp/p0.py
          echo "--- port 0 with shim"; LD_PRELOAD=/tmp/portshim.so python3 /tmp/p0.py
          echo "--- duplex-probe WITHOUT shim (expect stalls)"; timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv|\.\.\.after'
          echo "--- duplex-probe WITH shim (expect ~1 ms)";    LD_PRELOAD=/tmp/portshim.so timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv'
          echo "--- reuse-probe WITH shim, 20 rounds, gap 0";  LD_PRELOAD=/tmp/portshim.so REUSE_PORT=31980 timeout -s KILL 100 /tmp/rp 20 0 jdk
          echo "--- reuse-probe WITHOUT shim, 10 rounds, gap 0 (expect failures)"; REUSE_PORT=31981 timeout -s KILL 100 /tmp/rp 10 0 jdk
          exit 0
  rocky:
    runs-on: rocky
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Build the shim and probes, run them with and without it
        shell: sh
        run: |
          set +e
          dnf install -y -q gcc glibc-devel > /dev/null 2>&1; echo "install rc=$?"
          uname -r; (ldd --version 2>&1 | head -1)
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "shim build rc=$?"
          gcc -O2 -pthread -o /tmp/duplex duplex-probe.c; echo "duplex build rc=$?"
          gcc -O2 -pthread -o /tmp/rp reuse-probe.c 2>/dev/null; echo "reuse build rc=$?"
          cat > /tmp/p0.py <<'PY'
          import socket, threading, time
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(5); port = s.getsockname()[1]
          threading.Thread(target=lambda: s.accept(), daemon=True).start(); time.sleep(0.2)
          try: socket.create_connection(("127.0.0.1", port), timeout=3); print("port-0 listener reachable, port", port)
          except Exception as e: print("port-0 listener UNREACHABLE", port, e)
          PY
          echo "--- port 0 without shim"; python3 /tmp/p0.py
          echo "--- port 0 with shim"; LD_PRELOAD=/tmp/portshim.so python3 /tmp/p0.py
          echo "--- duplex-probe WITHOUT shim (expect stalls)"; timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv|\.\.\.after'
          echo "--- duplex-probe WITH shim (expect ~1 ms)";    LD_PRELOAD=/tmp/portshim.so timeout -s KILL 60 /tmp/duplex 2>&1 | grep -E '^reader=recv'
          echo "--- reuse-probe WITH shim, 20 rounds, gap 0";  LD_PRELOAD=/tmp/portshim.so REUSE_PORT=31980 timeout -s KILL 100 /tmp/rp 20 0 jdk
          echo "--- reuse-probe WITHOUT shim, 10 rounds, gap 0 (expect failures)"; REUSE_PORT=31981 timeout -s KILL 100 /tmp/rp 10 0 jdk
          exit 0
