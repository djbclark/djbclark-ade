name: runner disk experiments
on:
  push:
    branches: ['probe/**']
jobs:
  disk:
    runs-on: ubuntu
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Disk experiments (loop ext4, tmpfs, fio, parallel, realistic)
        run: bash ./disk-experiments.sh 2>&1
