name: Android CI (forgejo.mit.edu)

on:
  pull_request:
  push:
    branches: ['bench/**']

jobs:
  gradle-checks:
    runs-on: ubuntu

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install JDK 17 and Android SDK (timed separately from Gradle)
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Install JDK 17 and Android SDK (timed separately from Gradle) $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Install JDK 17 and Android SDK (timed separately from Gradle) $(date +%s.%N)"
          set -euo pipefail
          nproc; free -g | head -2
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless unzip gcc libc6-dev
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          java -version
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build loopback port-0 shim (libkrun#818 workaround)
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Build loopback port-0 shim (libkrun#818 workaround) $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Build loopback port-0 shim (libkrun#818 workaround) $(date +%s.%N)"
          cat > /tmp/portshim.c <<'SHIM_C'
          /* LD_PRELOAD shim: rewrite bind(port 0) to a concrete random port.
           *
           * Works around libkrun TSI bug libkrun#818: a listener bound to port 0 lands on
           * a different port in the VMM's netns and is unreachable; fixed-port binds work.
           * Inherited by every child JVM through the environment.
           *
           * Also works around a second TSI bug: shutdown(2) on a listening socket either fails with ENOTCONN
           * or, while another thread is blocked in accept(), never returns (getpeername blocks too, and getsockopt(SO_ACCEPTCONN) wrongly says 0). Java's ServerSocket.close() (and so
           * okhttp's MockWebServer.shutdown()) calls it and hangs the test JVM forever. A shutdown() on a
           * listening socket is made a no-op here; close() still wakes a blocked accept() through the JDK's signal.
           *
           *   gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl
           *   LD_PRELOAD=/tmp/portshim.so ./gradlew ...
           */
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <netinet/in.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <time.h>
          #include <unistd.h>

          typedef int (*bind_fn)(int, const struct sockaddr *, socklen_t);

          int bind(int fd, const struct sockaddr *addr, socklen_t len) {
              static bind_fn real;
              if (!real) real = (bind_fn)dlsym(RTLD_NEXT, "bind");
              if (!addr) return real(fd, addr, len);

              int zero = 0;
              if (addr->sa_family == AF_INET && len >= sizeof(struct sockaddr_in))
                  zero = ((const struct sockaddr_in *)addr)->sin_port == 0;
              else if (addr->sa_family == AF_INET6 && len >= sizeof(struct sockaddr_in6))
                  zero = ((const struct sockaddr_in6 *)addr)->sin6_port == 0;
              if (!zero) return real(fd, addr, len);

              union { struct sockaddr_storage ss; struct sockaddr_in a4; struct sockaddr_in6 a6; } copy;
              if (len > sizeof copy) return real(fd, addr, len);
              __builtin_memcpy(&copy, addr, len);
              unsigned seed = (unsigned)getpid() * 2654435761u ^ (unsigned)time(NULL) ^ (unsigned)fd;
              /* 20000-32000: below the kernel ephemeral range, so no clash with auto-assigned ports */
              for (int i = 0; i < 200; i++) {
                  unsigned short port = (unsigned short)(20000 + rand_r(&seed) % 12000);
                  if (copy.ss.ss_family == AF_INET) copy.a4.sin_port = htons(port);
                  else copy.a6.sin6_port = htons(port);
                  int rc = real(fd, (struct sockaddr *)&copy, len);
                  if (rc == 0 || errno != EADDRINUSE) return rc;
              }
              return real(fd, addr, len);
          }

          /* shutdown() on a listener must not reach the kernel, and the shim cannot ask the socket whether it is a
           * listener: under TSI getsockopt(SO_ACCEPTCONN) answers 0 for a listener, and getpeername and shutdown block while
           * another thread sits in accept(). So listening fds are recorded in listen() and forgotten in close()/dup2(). */
          #define MAXFD 65536
          static volatile unsigned char listening[MAXFD];

          typedef int (*listen_fn)(int, int);
          int listen(int fd, int backlog) {
              static listen_fn real;
              if (!real) real = (listen_fn)dlsym(RTLD_NEXT, "listen");
              int rc = real(fd, backlog);
              if (rc == 0 && fd >= 0 && fd < MAXFD) listening[fd] = 1;
              return rc;
          }

          typedef int (*close_fn)(int);
          int close(int fd) {
              static close_fn real;
              if (!real) real = (close_fn)dlsym(RTLD_NEXT, "close");
              if (fd >= 0 && fd < MAXFD) listening[fd] = 0;
              return real(fd);
          }

          typedef int (*dup2_fn)(int, int);
          int dup2(int oldfd, int newfd) {
              static dup2_fn real;
              if (!real) real = (dup2_fn)dlsym(RTLD_NEXT, "dup2");
              if (newfd >= 0 && newfd < MAXFD) listening[newfd] = 0;
              return real(oldfd, newfd);
          }

          typedef int (*dup3_fn)(int, int, int);
          int dup3(int oldfd, int newfd, int flags) {
              static dup3_fn real;
              if (!real) real = (dup3_fn)dlsym(RTLD_NEXT, "dup3");
              if (newfd >= 0 && newfd < MAXFD) listening[newfd] = 0;
              return real(oldfd, newfd, flags);
          }

          typedef int (*shutdown_fn)(int, int);
          static shutdown_fn real_shutdown;

          /* Any other socket: under TSI, shutdown() also blocks while another thread sits in a blocking read() or
           * connect() on it (okhttp's WebSocket reader; Socket.close() calls shutdown first). Run the real call in a
           * helper thread and give up waiting after 300 ms; the helper is then already inside the kernel, so the later
           * close() cannot race with fd reuse, and the JDK's dup2+signal wakes the blocked reader as usual. */
          struct sd { int fd, how, rc, err, done, refs; pthread_mutex_t m; pthread_cond_t c; };

          static void *sd_thread(void *p) {
              struct sd *a = p;
              int rc = real_shutdown(a->fd, a->how), e = errno;
              pthread_mutex_lock(&a->m);
              a->rc = rc; a->err = e; a->done = 1; pthread_cond_signal(&a->c);
              int last = --a->refs == 0;
              pthread_mutex_unlock(&a->m);
              if (last) free(a);
              return 0;
          }

          int shutdown(int fd, int how) {
              if (!real_shutdown) real_shutdown = (shutdown_fn)dlsym(RTLD_NEXT, "shutdown");
              if (fd >= 0 && fd < MAXFD && listening[fd]) return 0;
              static int mode = -1;   /* SHIM_SHUTDOWN: async (default) | passthrough | noop, for experiments */
              if (mode < 0) { const char *e = getenv("SHIM_SHUTDOWN"); mode = !e ? 0 : !strcmp(e, "passthrough") ? 1 : !strcmp(e, "noop") ? 2 : 0; }
              if (mode == 1) return real_shutdown(fd, how);
              if (mode == 2) return 0;
              struct sd *a = calloc(1, sizeof *a);
              pthread_t t;
              if (!a) return real_shutdown(fd, how);
              a->fd = fd; a->how = how; a->refs = 2;
              pthread_mutex_init(&a->m, 0); pthread_cond_init(&a->c, 0);
              if (pthread_create(&t, 0, sd_thread, a)) { free(a); return real_shutdown(fd, how); }
              pthread_detach(t);
              struct timespec dl; clock_gettime(CLOCK_REALTIME, &dl);
              dl.tv_nsec += 300 * 1000000L; if (dl.tv_nsec >= 1000000000L) { dl.tv_sec++; dl.tv_nsec -= 1000000000L; }
              int rc = 0, e = 0;
              pthread_mutex_lock(&a->m);
              while (!a->done && pthread_cond_timedwait(&a->c, &a->m, &dl) == 0) ;
              if (a->done) { rc = a->rc; e = a->err; }
              int last = --a->refs == 0;
              pthread_mutex_unlock(&a->m);
              if (last) free(a);
              if (rc) { errno = e; return rc; }
              return 0;
          }
          SHIM_C
          cat > /usr/local/bin/hb.sh <<'HB_SH'
          #!/bin/sh
          # Heartbeat for hang diagnosis, installed as /usr/local/bin/hb.sh by derive-forgejo-ci.py.
          # Every 15 s: load, memory, java count, top-3 processes, test progress (result XML files written so far).
          # For each Gradle test worker: lifetime CPU ticks, thread count, threads in uninterruptible sleep (D);
          # every 75 s a jstack summary: thread states, most common thread names, the "Test worker" thread, and any
          # thread that is shutting the JVM down.
          i=0
          while :; do
            echo "HEARTBEAT $(date +%T) load=$(cut -d' ' -f1-3 /proc/loadavg) $(free -m | awk '/Mem/{print "used="$3" avail="$7}') java=$(pgrep -c java) results_xml=$(ls /workspace/*/*/app/build/test-results/testStableDebugUnitTest/*.xml 2>/dev/null | wc -l) test_files=$(find /workspace/*/*/app/src/test -name '*Test.kt' 2>/dev/null | wc -l)"
            ps -eo pid,pcpu,rss,stat,etimes,args --sort=-pcpu | sed -n 2,4p | cut -c1-150
            for p in $(pgrep -f 'Gradle Test Executor'); do
              echo "TESTWORKER pid=$p cpu_ticks=$(awk '{print $14+$15}' /proc/$p/stat) threads=$(ls /proc/$p/task | wc -l) D=$(cat /proc/$p/task/*/stat 2>/dev/null | awk '{print $3}' | grep -c D)"
              if [ $((i % 5)) = 4 ]; then
                jstack "$p" > /tmp/js.$p 2>&1
                echo "JSTACK pid=$p $(grep 'Thread.State' /tmp/js.$p | sort | uniq -c | tr -s ' ' | tr '\n' ';')"
                echo "THREADNAMES $(grep '^"' /tmp/js.$p | sed -E 's/^"([^"]*)".*/\1/; s/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -8 | tr -s ' ' | tr '\n' ';')"
                grep -A32 '^"Test worker"' /tmp/js.$p | cut -c1-170
                awk 'BEGIN{RS="";ORS="\n\n"} /java.lang.Shutdown|Runtime.exit|DestroyJavaVM/' /tmp/js.$p | head -50 | cut -c1-170
                echo "WORKER-OTHER-THREADS (not looper/GC/pool)"
                awk 'BEGIN{RS="";ORS="\n\n"} !/queued-work-looper|DefaultDispatcher|GC Thread|Refine|Conc#|Cleaner|pool-|Compiler|Signal|Reference|Finalizer|Service Thread|Monitor|Notification|Attach|Sweeper|VM Thread/ && /org.gradle|plektra|robolectric|java.net|SocketChannel/' /tmp/js.$p | head -70 | cut -c1-170
              fi
            done
            if [ $((i % 5)) = 4 ]; then
              dp=$(pgrep -f 'GradleDaemon' | head -1)
              if [ -n "$dp" ]; then
                jstack "$dp" > /tmp/jd.$dp 2>&1
                echo "DAEMONSTACK pid=$dp $(grep 'Thread.State' /tmp/jd.$dp | sort | uniq -c | tr -s ' ' | tr '\n' ';')"
                awk 'BEGIN{RS="";ORS="\n\n"} /SocketChannelImpl|EPoll|test|Test|worker/ && !/GC Thread|Refine|Conc#|Cleaner|Compiler|Signal|Reference|Finalizer|Service Thread|Attach|Sweeper|VM Thread/' /tmp/jd.$dp | head -90 | cut -c1-170
              fi
              echo "TCP $(awk 'NR>1{print $4}' /proc/net/tcp /proc/net/tcp6 2>/dev/null | sort | uniq -c | tr -s ' ' | tr '\n' ';') QUEUED=$(awk 'NR>1 && $5!="00000000:00000000"{n++} END{print n+0}' /proc/net/tcp /proc/net/tcp6 2>/dev/null)"
            fi
            i=$((i+1)); sleep 15
          done
          HB_SH
          chmod +x /usr/local/bin/hb.sh
          gcc -shared -fPIC -O2 -pthread -o /usr/local/lib/portshim.so /tmp/portshim.c -ldl
          echo /usr/local/lib/portshim.so >> /etc/ld.so.preload
          true && python3 -c 'print("preload ok")'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile stable debug (compile time only)
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Compile stable debug (compile time only) $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Compile stable debug (compile time only) $(date +%s.%N)"
          ./gradlew :app:compileStableDebugKotlin :app:compileStableDebugJavaWithJavac

      - name: Run core modifier regression tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run core modifier regression tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run core modifier regression tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.core.ModifierStateControllerTest

      - name: Run input router modifier E2E tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run input router modifier E2E tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run input router modifier E2E tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.InputEventRouterModifierE2ETest

      - name: Run input router forward-delete tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run input router forward-delete tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run input router forward-delete tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.InputEventRouterForwardDeleteAlternativesTest

      - name: Run IME device behaviour tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run IME device behaviour tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run IME device behaviour tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.PhysicalKeyboardInputMethodServiceDeviceBehaviorTest

      - name: Run stable debug unit tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run stable debug unit tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run stable debug unit tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest

      - name: Run stable release unit tests (F-Droid path)
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run stable release unit tests (F-Droid path) $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run stable release unit tests (F-Droid path) $(date +%s.%N)"
          ./gradlew :app:testStableReleaseUnitTest -PPLEKTRA_FDROID_BUILD=true

      - name: Run nightly debug unit tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run nightly debug unit tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run nightly debug unit tests $(date +%s.%N)"
          ./gradlew :app:testNightlyDebugUnitTest

      - name: Compile and test Google Play variants
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Compile and test Google Play variants $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Compile and test Google Play variants $(date +%s.%N)"
          ./gradlew :app:testPlayStableDebugUnitTest :app:testPlayNightlyDebugUnitTest

      - name: Run nightly release unit tests
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run nightly release unit tests $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run nightly release unit tests $(date +%s.%N)"
          ./gradlew :app:testNightlyReleaseUnitTest

      - name: Run stable debug lint
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run stable debug lint $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run stable debug lint $(date +%s.%N)"
          ./gradlew :app:lintStableDebug

      - name: Run stable release lint
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run stable release lint $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run stable release lint $(date +%s.%N)"
          ./gradlew :app:lintStableRelease

      - name: Run nightly debug lint
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run nightly debug lint $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run nightly debug lint $(date +%s.%N)"
          ./gradlew :app:lintNightlyDebug

      - name: Run nightly release lint
        timeout-minutes: 25
        run: |
          trap 'rc=$?; [ -n "$HB" ] && kill $HB 2>/dev/null; echo "BENCHSTEP end Run nightly release lint $(date +%s.%N) rc=$rc"' EXIT
          HB=; [ -x /usr/local/bin/hb.sh ] && { /usr/local/bin/hb.sh & HB=$!; } || true
          echo "BENCHSTEP start Run nightly release lint $(date +%s.%N)"
          ./gradlew :app:lintNightlyRelease

      - name: Storage and memory used by this build
        if: always()
        run: |
          echo "BENCHUSAGE workspace $(du -shL "$GITHUB_WORKSPACE" 2>/dev/null | cut -f1) gradle_home $(du -shL "$HOME/.gradle" 2>/dev/null | cut -f1) android_sdk $(du -shL "$HOME/android-sdk" 2>/dev/null | cut -f1)"
          df -hT / /mnt/fast /dev/shm 2>/dev/null; free -m | head -2
