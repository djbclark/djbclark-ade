name: runner probe (shim)
on:
  push:
    branches: ['probe/**']
jobs:
  shim:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Install JDK 17 and a C compiler
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless unzip gcc libc6-dev
          gcc --version | head -1
          java -version
      - name: Build the shim and test it with python and java
        run: |
          set +e
          gcc -shared -fPIC -O2 -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "gcc rc=$?"
          cat > /tmp/lo.py <<'PY'
          import socket, threading, time
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(5); port = s.getsockname()[1]
          threading.Thread(target=lambda: s.accept(), daemon=True).start(); time.sleep(0.2)
          try:
              socket.create_connection(("127.0.0.1", port), timeout=5); print("python loopback OK port", port)
          except Exception as e: print("python loopback FAIL", port, e)
          PY
          echo "--- without shim"; python3 /tmp/lo.py
          echo "--- with shim"; LD_PRELOAD=/tmp/portshim.so python3 /tmp/lo.py
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          cat > /tmp/Lo.java <<'JAVA'
          import java.net.*;
          public class Lo { public static void main(String[] a) throws Exception {
            try (ServerSocket s = new ServerSocket(0, 5, InetAddress.getLoopbackAddress())) {
              try (Socket c = new Socket()) { c.connect(new InetSocketAddress(InetAddress.getLoopbackAddress(), s.getLocalPort()), 3000); System.out.println("java loopback OK port " + s.getLocalPort()); }
            } catch (Exception e) { System.out.println("java loopback FAIL " + e); } } }
          JAVA
          echo "--- java without shim"; java /tmp/Lo.java
          echo "--- java with shim"; LD_PRELOAD=/tmp/portshim.so java /tmp/Lo.java 2>&1 | grep -v Picked
      - name: Gradle variants (empty project, then a project with a forked test worker)
        run: |
          set +e
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          chmod +x ./gradlew
          mkdir -p /tmp/emptyproj /tmp/testproj/src/test/java
          echo "rootProject.name='empty'" > /tmp/emptyproj/settings.gradle
          echo "rootProject.name='tp'" > /tmp/testproj/settings.gradle
          cat > /tmp/testproj/build.gradle <<'G'
          plugins { id 'java' }
          repositories { mavenCentral() }
          dependencies { testImplementation 'junit:junit:4.13.2' }
          G
          cat > /tmp/testproj/src/test/java/T.java <<'J'
          public class T { @org.junit.Test public void t() { org.junit.Assert.assertTrue(true); } }
          J
          try() { echo "=== $1"; shift; ( "$@" ) > /tmp/out.txt 2>&1; rc=$?; grep -E "BUILD|Could not connect|FAILURE|Connection refused|single-use" /tmp/out.txt | head -4; echo "rc=$rc"; ./gradlew --stop > /dev/null 2>&1 || true; }
          ./gradlew --version > /dev/null 2>&1; echo "wrapper fetched rc=$?"
          export LD_PRELOAD=/tmp/portshim.so
          try "SHIM: default daemon, empty project" ./gradlew -p /tmp/emptyproj help
          try "SHIM: default daemon, forked test worker" ./gradlew -p /tmp/testproj test
          unset LD_PRELOAD
          GRADLE_OPTS="-Xmx512m -Dfile.encoding=UTF-8" try "NO SHIM: in-process (--no-daemon, matching JVM args), empty project" ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8" -p /tmp/emptyproj help
          GRADLE_OPTS="-Xmx512m -Dfile.encoding=UTF-8" try "NO SHIM: in-process, forked test worker" ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8" -p /tmp/testproj test
        continue-on-error: true
