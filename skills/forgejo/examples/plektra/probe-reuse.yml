name: runner probe (port reuse after a blocked accept)
on:
  push:
    branches: ['probe/**']
jobs:
  reuse:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: New listener on a port whose old listener was closed while a thread sat in accept()
        shell: bash
        run: |
          set +e
          apt-get update -qq; apt-get install -y -qq gcc libc6-dev > /dev/null
          uname -r
          gcc -O2 -pthread -o /tmp/rp reuse-probe.c 2>/dev/null; echo "gcc rc=$?"
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "shim gcc rc=$?"
          one() { lbl=$1; shift; echo "--- $lbl"; REUSE_VERBOSE=1 timeout -s KILL 200 "$@" > /tmp/o.txt 2> /tmp/e.txt; echo "   (exit $?)"; grep -E '^wake=' /tmp/o.txt; echo "   failing rounds: $(grep FAIL /tmp/e.txt | cut -d: -f1 | tr -d 'round ' | tr '\n' ' ')"; }
          S="env LD_PRELOAD=/tmp/portshim.so /tmp/rp"
          # Does a stale listener leaked by earlier rounds on a port explain failures of LATER shimmed rounds on that port?
          one "1. SHIM first, fresh port 31960, 40 rounds (expect 40 ok)" $S 40 0 jdk
          one "2. NO shim, leak stale listeners on port 31961, 10 rounds" env REUSE_PORT=31961 /tmp/rp 10 0 jdk
          one "3. SHIM on the leaked port 31961, 40 rounds" env REUSE_PORT=31961 LD_PRELOAD=/tmp/portshim.so /tmp/rp 40 0 jdk
          one "4. SHIM on an untouched port 31962, same job, 40 rounds" env REUSE_PORT=31962 LD_PRELOAD=/tmp/portshim.so /tmp/rp 40 0 jdk
          sleep 60; one "5. SHIM on the leaked port 31961 again, 60 s later, 40 rounds" env REUSE_PORT=31961 LD_PRELOAD=/tmp/portshim.so /tmp/rp 40 0 jdk
          sleep 240; one "6. SHIM on the leaked port 31961 again, 5 min later, 40 rounds" env REUSE_PORT=31961 LD_PRELOAD=/tmp/portshim.so /tmp/rp 40 0 jdk
          exit 0
