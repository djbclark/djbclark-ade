name: runner probe (java MockWebServer churn)
on:
  push:
    branches: ['probe/**']
jobs:
  javachurn:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: JDK 17, compiler, shim, okhttp jars
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless gcc libc6-dev curl > /dev/null
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "gcc rc=$?"
          bash fetch-and-build.sh /tmp/jc
          getent hosts localhost; cat /etc/hosts | head -5
      - name: One MockWebServer per iteration, OkHttpClient to http://localhost:PORT/ (a correct stack reports 0 errors)
        run: |
          set +e
          cd /tmp/jc
          run() { lbl=$1; shift; echo "=== $lbl"; timeout -s KILL 200 env LD_PRELOAD=/tmp/portshim.so "$@" > /tmp/o.txt 2>&1; echo "   (exit $?)"; grep -v Picked /tmp/o.txt | grep -v '^\[java' | grep -E 'iter|threads=|  [0-9]+  '; }
          J='java -cp *:.'
          cd /tmp/jc; CP="$(ls *.jar | tr '\n' ':').:"
          run "WebSocket echo, 1 thread, 60 iterations, trace"  java -Djava.net.preferIPv4Stack=true -cp "$CP" Churn 60 1 newClient get ws trace
          run "WebSocket echo, 8 threads, 400 iterations"        java -cp "$CP" Churn 400 8 newClient get ws
          run "WebSocket echo, 8 threads, SHIM_SHUTDOWN=noop"    env SHIM_SHUTDOWN=noop java -cp "$CP" Churn 400 8 newClient get ws
          exit 0
