name: runner probe (duplex send while recv blocked)
on:
  push:
    branches: ['probe/**']
jobs:
  duplex:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Does send() stall while another thread is blocked in recv() on the same socket?
        run: |
          apt-get update -qq; apt-get install -y -qq gcc libc6-dev > /dev/null
          uname -r
          gcc -O2 -pthread -o /tmp/duplex duplex-probe.c && timeout -s KILL 60 /tmp/duplex; echo "(exit $?)"
