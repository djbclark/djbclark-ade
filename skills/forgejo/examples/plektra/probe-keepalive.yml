name: runner probe (keep-alive loopback)
on:
  push:
    branches: ['probe/**']
jobs:
  keepalive:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Build the shim
        run: |
          apt-get update -qq; apt-get install -y -qq gcc libc6-dev > /dev/null
          gcc -shared -fPIC -O2 -pthread -o /tmp/portshim.so loopback-port-shim.c -ldl; echo "gcc rc=$?"
      - name: Loopback HTTP keep-alive stress, every combination (a correct stack reports 0 errors)
        run: |
          set +e
          run() { echo "=== $1"; shift; timeout -s KILL 60 "$@"; echo "   (exit $?)"; }
          for m in plain shutdown mixed; do
            for c in 8 16; do
              run "no shim, fixed port, $m, $c clients"   env REPRO_PORT=31555 python3 keepalive-repro.py 20 $c $m
              run "shim (LD_PRELOAD), port 0, $m, $c clients" env LD_PRELOAD=/tmp/portshim.so python3 keepalive-repro.py 20 $c $m
              run "shim, SHIM_SHUTDOWN=noop, $m, $c clients" env SHIM_SHUTDOWN=noop LD_PRELOAD=/tmp/portshim.so python3 keepalive-repro.py 20 $c $m
            done
          done
          exit 0
