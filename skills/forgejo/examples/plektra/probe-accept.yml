name: runner probe (accept wake-up)
on:
  push:
    branches: ['probe/**']
jobs:
  accept:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: What wakes a blocked accept() on a loopback listener
        run: |
          apt-get update -qq; apt-get install -y -qq gcc libc6-dev > /dev/null
          gcc -O2 -pthread -o /tmp/ap accept-probe.c || exit 1
          for m in 7 8 5 6; do timeout -s KILL 8 /tmp/ap $m; echo "   (exit $?)"; done
          echo "--- with the same listener type in a thread-less shutdown"
          python3 - <<'PY'
          import socket
          s = socket.socket(); s.bind(("127.0.0.1", 31499)); s.listen(5)
          try: s.shutdown(socket.SHUT_RDWR); print("py shutdown(listener) ok")
          except OSError as e: print("py shutdown(listener) error", e)
          PY
          exit 0
