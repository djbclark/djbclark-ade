<title>SIPB LLMs Agent Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: left rail with contents on wide screens, one column on phones; a plain technical report */
:root {
  --paper: #f5f7f8; --ink: #15212b; --muted: #55646f; --rule: #d3dbe1; --accent: #0b6a6a; --wash: #e9eff1; --codebg: #eaeff2;
  --font-text: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f161b; --ink: #e2e9ed; --muted: #9aabb6; --rule: #2a3741; --accent: #5cc6c0; --wash: #17222a; --codebg: #17222a; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0f161b; --ink: #e2e9ed; --muted: #9aabb6; --rule: #2a3741; --accent: #5cc6c0; --wash: #17222a; --codebg: #17222a; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.62 var(--font-text); padding-inline: 16px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 32px 64px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; }
nav { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; }
nav .label { font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
nav a { color: var(--ink); text-decoration: none; display: block; padding-left: 10px; border-left: 2px solid var(--rule); line-height: 1.35; }
nav a:hover, nav a:focus-visible { border-left-color: var(--accent); color: var(--accent); outline: none; }
main { min-width: 0; max-width: 70ch; }
h1 { font: 600 clamp(26px, 4.2vw, 36px)/1.18 var(--font-text); letter-spacing: -.01em; margin: 0 0 20px; text-wrap: balance; }
h2 { font: 600 22px/1.25 var(--font-text); margin: 44px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); text-wrap: balance; scroll-margin-top: 16px; }
h2:first-of-type { margin-top: 28px; }
p, li { text-wrap: pretty; }
p { margin: 0 0 14px; }
ol, ul { padding-left: 1.3em; margin: 0 0 14px; }
li { margin-bottom: 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font: 400 .88em var(--font-mono); background: var(--codebg); padding: 1px 5px; border-radius: 3px; }
strong { font-weight: 600; }
.tablewrap { overflow-x: auto; margin: 6px 0 18px; border: 1px solid var(--rule); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
th { text-align: left; font: 500 12px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--wash); }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:not(:first-child) { font-variant-numeric: tabular-nums; }
.meta { font: 400 13px var(--font-mono); color: var(--muted); margin: 0 0 26px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  nav { position: static; }
  nav ol { flex-direction: row; flex-wrap: wrap; gap: 6px 14px; }
  nav a { border-left: 0; padding-left: 0; text-decoration: underline; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div class="wrap">
  <nav aria-label="Sections"><div class="label">Sections</div><ol>{{TOC}}</ol></nav>
  <main>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
    {{BODY}}
  </main>
</div>
